<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Faiz</title>
<meta name="description" content="Faiz: diga o que precisa, ele organiza e te lembra.">
<meta name="theme-color" content="#E8E7FC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Faiz">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap">
<style>
/* Layout: uma coluna de app (até 480 px) com barra inferior fixa; tema claro único, como o sistema de design do Faiz. */
:root{
  color-scheme:light;
  --navy:#0C2A48; --on-navy:#FFFFFF; --teal:#2EC4B6; --teal-soft:#E6F7F4; --teal-ink:#0F7A70;
  --ground:#F6F6FB; --surface:#FFFFFF; --sunken:#F6F7FC; --chip:#F1F1F8; --line:#E6E7F0; --line-strong:#C9CDF7;
  --ink:#1A1D2E; --ink-muted:#5F6478; --ink-subtle:#A3A7B7; --ink-inverse:#16182A;
  --blue:#6F7FF0; --blue-soft:#EEF0FE; --blue-ink:#4453C8; --green:#6FD3A6; --green-soft:#E3F7EE; --green-ink:#237A54;
  --peach:#F2A385; --peach-soft:#FDEDE6; --peach-ink:#A84B2B; --lilac:#B7A6F0; --lilac-soft:#F1ECFD; --lilac-ink:#6A4CC8;
  --red:#F0644A; --red-strong:#C9381F; --red-ink:#B93A22; --warn-soft:#FFF4DA; --warn-ink:#8A5E00; --toggle-off:#C4C7D6;
  --g-lav:#D9DAFB; --g-lav-mid:#E8E7FC; --g-peach:#F9E1D6; --g-rose:#F4E5EC;
  --sh-card:0 10px 30px -18px rgba(60,66,120,.35); --sh-float:0 6px 16px -10px rgba(60,66,120,.5);
  --sh-nav:0 -8px 30px -12px rgba(60,66,120,.18); --sh-brand:0 10px 24px -10px rgba(12,42,72,.45);
  --f-ui:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --gutter:max(20px,env(safe-area-inset-left,0px));
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#E9E9F4;color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
[hidden]{display:none!important}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:var(--ground);overflow-x:hidden}
.screen{min-height:100vh;min-height:100dvh;padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(128px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.bg-lav{background:linear-gradient(180deg,var(--g-lav) 0,var(--g-lav-mid) 220px,var(--ground) 440px)}
.bg-soft{background:linear-gradient(180deg,var(--g-lav-mid) 0,#F2F2FB 200px,var(--ground) 520px)}
.bg-peach{background:linear-gradient(180deg,var(--g-peach) 0,var(--g-rose) 40%,var(--g-lav-mid) 100%)}
.bg-welcome{background:linear-gradient(180deg,var(--g-lav) 0,#EDE8F7 50%,#F9E6DD 100%)}

/* tipografia */
.greeting{font-size:31px;font-weight:600;letter-spacing:-.02em;margin:2px 0 0;line-height:1.15;text-wrap:balance}
.title{font-size:21px;font-weight:600;letter-spacing:-.01em;margin:0}
.screen-title{font-size:19px;font-weight:600;margin:0;text-align:center;flex:1}
.meta{font-size:13.5px;color:var(--ink-muted)}
.label{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-muted);margin:24px 0 10px}
.muted{color:var(--ink-muted)}
.num{font-variant-numeric:tabular-nums}

/* blocos */
.row{display:flex;align-items:center;gap:12px}
.head{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;margin-bottom:8px}
.round{width:46px;height:46px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;box-shadow:var(--sh-float);padding:0}
.round svg{width:21px;height:21px}
.avatar{width:46px;height:46px;border-radius:50%;border:3px solid var(--surface);background:var(--blue);color:#fff;font-weight:700;font-size:18px;display:grid;place-items:center;box-shadow:var(--sh-float);padding:0}
.card{background:var(--surface);border-radius:24px;box-shadow:var(--sh-card)}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.45);padding:5px;border-radius:999px;margin:22px 0 20px}
.tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 0;color:var(--ink-muted);font-size:14.5px}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 4px 12px -8px rgba(60,66,120,.5)}
.list{display:flex;flex-direction:column;gap:12px}
.task{display:flex;align-items:center;gap:14px;padding:16px 16px 16px 18px}
.task .bar{width:4px;align-self:stretch;border-radius:3px;flex:none}
.task .txt{flex:1;min-width:0}
.task .t{font-weight:500;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.task .s{font-size:13.5px;color:var(--ink-muted);margin-top:2px;font-variant-numeric:tabular-nums}
.task.done .t{color:var(--ink-subtle);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.tag{display:inline-block;white-space:nowrap;font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 6px;margin-top:3px}
.tag.faz{color:var(--teal-ink);background:var(--teal-soft)}
.tag.blue{color:var(--blue-ink);background:var(--blue-soft)}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);flex:none;display:grid;place-items:center;padding:0;position:relative}
.chk::after{content:"";position:absolute;inset:-8px}
.chk.on{background:var(--blue);border-color:var(--blue)}
.chk svg{width:15px;height:15px;color:#fff}
.del{width:30px;height:30px;border-radius:50%;border:0;background:var(--chip);display:grid;place-items:center;color:var(--ink-muted);flex:none;padding:0}
.del svg{width:14px;height:14px}
.prog{display:flex;align-items:center;gap:14px;padding:16px}
.stat{font-size:12px;color:var(--ink-muted);line-height:1.3;white-space:nowrap}
.stat b{display:flex;align-items:center;gap:5px;color:var(--ink);font-size:13px;font-weight:600}
.stat i{width:7px;height:7px;border-radius:50%;display:inline-block}
.empty{text-align:center;padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:8px}
.spark{width:56px;height:56px;border-radius:18px;background:var(--teal-soft);color:var(--teal-ink);display:grid;place-items:center}
.idea{display:block;width:100%;text-align:left;border:0;background:var(--surface);border-radius:18px;padding:13px 16px;box-shadow:var(--sh-card);font-size:15px}
.btn{border:0;border-radius:18px;padding:15px 18px;font-weight:600;font-size:16px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-decoration:none}
.btn.light{background:var(--chip);color:var(--ink)}
.btn.white{background:var(--surface);color:var(--ink);box-shadow:var(--sh-float)}
.btn:disabled{opacity:.45}
.textbtn{border:0;background:none;color:var(--blue-ink);font-weight:600;font-size:14px;padding:6px 0}
.pill{border:0;border-radius:999px;padding:8px 14px;background:var(--blue-soft);color:var(--blue-ink);font-weight:600;font-size:13.5px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.pill.navy{background:var(--navy);color:#fff}

/* barra inferior */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;height:calc(84px + env(safe-area-inset-bottom,0px));padding:12px max(10px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(10px,env(safe-area-inset-left,0px));background:var(--surface);border-radius:30px 30px 0 0;box-shadow:var(--sh-nav);display:grid;grid-template-columns:repeat(5,1fr);align-items:start;z-index:20}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--ink-muted);padding:4px 0}
.nav button svg{width:24px;height:24px}
.nav button[aria-current=page]{color:var(--blue-ink);font-weight:600}
.nav button[aria-current=page] svg{color:var(--blue)}
.nav .center{margin-top:-38px}
.nav .ring{width:74px;height:74px;border-radius:24px;background:var(--surface);display:grid;place-items:center;box-shadow:var(--sh-brand)}
.nav .center[aria-current=page] .ring{box-shadow:0 0 0 3px var(--teal),var(--sh-brand)}
.nav .ring svg{width:58px;height:58px}

/* agenda */
.month{display:flex;align-items:center;justify-content:space-between;margin:12px 0 16px}
.month b{font-size:24px;font-weight:600;letter-spacing:-.01em}
.arrow{border:0;background:none;width:32px;height:32px;display:grid;place-items:center;color:var(--ink-muted);padding:0}
.arrow svg{width:20px;height:20px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.week .wd{font-size:13px;color:var(--ink-muted);margin-bottom:8px}
.week button{width:40px;height:40px;max-width:100%;margin:0 auto;border-radius:50%;border:0;background:var(--surface);font-size:16px;font-weight:500;position:relative;font-variant-numeric:tabular-nums;padding:0}
.week button.past{color:var(--ink-muted);background:rgba(255,255,255,.55)}
.week button.sel{background:var(--ink-inverse);color:#fff}
.week button.has::after{content:"";position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--red)}
.tl-wrap{margin-top:16px;height:calc(100dvh - 330px);min-height:320px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.tl-wrap::-webkit-scrollbar{display:none}
.timeline{position:relative}
.hour{height:64px;border-top:1px solid var(--line);position:relative}
.hour span{position:absolute;top:-9px;left:0;font-size:11.5px;color:var(--ink-muted);background:var(--ground);padding-right:6px;font-variant-numeric:tabular-nums}
.ev{position:absolute;left:52px;right:0;border-radius:18px;background:var(--surface);padding:9px 12px;display:flex;justify-content:space-between;gap:8px;box-shadow:var(--sh-card);overflow:hidden;border-left:4px solid var(--blue)}
.ev .t{font-size:14.5px;font-weight:500;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .s{font-size:12px;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.ev.done{opacity:.6}
.ev .chk{width:22px;height:22px}
.ev .chk svg{width:12px;height:12px}
.now{position:absolute;left:44px;right:0;height:2px;background:var(--red);z-index:3}
.now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.now span{position:absolute;left:-46px;top:-9px;font-size:11px;font-weight:700;color:var(--red-ink);background:var(--ground);padding-right:3px;font-variant-numeric:tabular-nums}

/* assistente */
.chat{display:flex;flex-direction:column;gap:12px;padding-bottom:calc(230px + env(safe-area-inset-bottom,0px))}
.msg{max-width:88%;padding:13px 16px;border-radius:22px;font-size:15px;line-height:1.45;white-space:pre-line;overflow-wrap:anywhere}
.msg.bot{background:var(--surface);border-top-left-radius:8px;box-shadow:var(--sh-card)}
.msg.me{background:var(--ink-inverse);color:#fff;align-self:flex-end;border-top-right-radius:8px}
.plan{margin-top:10px;display:flex;flex-direction:column;gap:6px;white-space:normal}
.plan div{display:flex;gap:10px;align-items:center;background:var(--sunken);border-radius:12px;padding:8px 10px;font-size:14px}
.plan b{font-variant-numeric:tabular-nums;font-weight:700;color:var(--blue-ink);width:44px;flex:none}
.plan i{width:4px;align-self:stretch;border-radius:2px;flex:none}
.plan span{flex:1;min-width:0}
.plan small{margin-left:auto;color:var(--ink-muted);font-size:12px;white-space:nowrap;flex:none}
.note{margin-top:10px;font-size:14px;color:var(--ink-muted)}
.acts{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;white-space:normal}
.typing{display:flex;align-items:center;gap:10px;color:var(--ink-muted);font-size:14.5px}
.typing i{width:6px;height:6px;border-radius:50%;display:inline-block;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s;background:var(--peach)!important}
.typing i:nth-child(3){animation-delay:.3s;background:var(--lilac)!important}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.composer{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:480px;bottom:calc(92px + env(safe-area-inset-bottom,0px));padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));z-index:15}
.sugs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.sugs::-webkit-scrollbar{display:none}
.sugs button{flex:none;border:0;background:rgba(255,255,255,.85);border-radius:999px;padding:8px 13px;font-size:13.5px;box-shadow:var(--sh-float)}
.inputbox{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:6px 6px 6px 18px;box-shadow:0 10px 26px -16px rgba(60,66,120,.55)}
.inputbox input{flex:1;border:0;outline:0;font-size:16px;background:transparent;min-width:0;padding:8px 0}
.inputbox button{width:42px;height:42px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--ink-inverse);color:#fff;padding:0;flex:none}
.inputbox button svg{width:19px;height:19px}
.inputbox button:disabled{opacity:.4}
.inputbox .mic{background:var(--chip);color:var(--ink)}
.inputbox .mic.on{background:var(--red-strong);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,56,31,.45)}70%{box-shadow:0 0 0 12px rgba(201,56,31,0)}100%{box-shadow:0 0 0 0 rgba(201,56,31,0)}}
.places{margin-top:10px;display:flex;flex-direction:column;gap:8px;white-space:normal}
.place{display:flex;align-items:center;gap:10px;background:var(--sunken);border-radius:14px;padding:10px 12px}
.place .txt{flex:1;min-width:0}
.place .n{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.place .d{font-size:12.5px;color:var(--ink-muted)}
.place a{flex:none}
.iris{border-radius:50%;flex:none;background:#F1ECFD;object-fit:cover;display:block}
.botrow{display:flex;gap:8px;align-items:flex-end;max-width:94%}
.botrow .msg{max-width:none;flex:1;min-width:0}
.irisline{border:0;width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:12px 14px;margin-top:16px;font-size:15px;line-height:1.4;color:var(--ink)}
.irisline span{flex:1;min-width:0}
.ai-note{font-size:12.5px;color:var(--ink-muted);text-align:center;margin:6px 0 2px}

/* mais / formulários */
.setrow{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;border:0;background:none;text-align:left;text-decoration:none;color:inherit}
.setrow+.setrow{border-top:1px solid var(--line)}
.setrow .txt{flex:1;min-width:0}
.setrow .t{font-weight:500}
.toggle{width:46px;height:28px;border-radius:14px;border:0;background:var(--toggle-off);position:relative;flex:none;padding:0;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.toggle[aria-checked=true]{background:var(--teal)}
.toggle[aria-checked=true]::after{left:21px}
.field{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px;font-size:16px;color:var(--ink);background:var(--sunken)}
textarea.field{resize:none;height:110px}
.flabel{font-size:13px;color:var(--ink-muted);font-weight:600;display:flex;flex-direction:column;gap:6px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 0;font-size:14px}
.seg button[aria-pressed=true]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue-ink);font-weight:600}
.err{color:var(--red-ink);font-size:13px;margin:0}
.stars{display:flex;gap:8px}
.stars button{flex:1;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 0;font-weight:600;font-size:16px}
.stars button[aria-pressed=true]{border-color:var(--navy);background:var(--navy);color:#fff}
.badge{font-size:11.5px;font-weight:700;border-radius:6px;padding:3px 7px;background:var(--warn-soft);color:var(--warn-ink)}
.callink{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--sunken);text-decoration:none;color:var(--ink)}
.callink b{font-variant-numeric:tabular-nums;color:var(--blue-ink);width:44px;flex:none}
.callink span{flex:1;min-width:0}
.callink em{font-style:normal;color:var(--blue-ink);font-weight:600;font-size:13.5px;white-space:nowrap}
.callink.ok em{color:var(--green-ink)}

/* boas-vindas */
.welcome{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:40px}
.welcome .mark svg{width:96px;height:96px;filter:drop-shadow(0 14px 20px rgba(12,42,72,.25))}
.wm{font-family:var(--f-display);font-weight:800;font-size:50px;letter-spacing:-.02em;color:var(--navy);display:inline-flex;align-items:flex-end;line-height:1;margin-top:20px}
.wm .i{display:inline-block;width:.15em;height:.56em;background:currentColor;border-radius:.05em;margin:0 .02em 0 -.07em;position:relative;transform:translateY(-.02em)}
.wm .i svg{position:absolute;left:50%;bottom:calc(100% + .1em);width:.42em;height:.42em;transform:translateX(-50%)}
.tagline{font-size:17px;letter-spacing:.06em;color:var(--ink-muted);margin-top:6px}
.bul{display:flex;gap:12px;align-items:center;text-align:left}
.bul span:first-child{width:28px;height:28px;border-radius:50%;background:var(--teal-soft);color:var(--teal-ink);display:grid;place-items:center;flex:none}
.bul svg{width:14px;height:14px}

/* sobreposições */
.toast{position:fixed;left:50%;transform:translate(-50%,10px);width:calc(100% - 40px);max-width:440px;bottom:calc(104px + env(safe-area-inset-bottom,0px));background:var(--ink-inverse);color:#fff;border-radius:16px;padding:12px 16px;font-size:14px;z-index:40;opacity:0;transition:.25s;pointer-events:none;display:flex;gap:12px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:none;color:#B7C3FF;font-weight:700;padding:0}
.sheet-bg{position:fixed;inset:0;background:rgba(22,24,42,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:30px 30px 0 0;padding:22px max(22px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:88dvh;overflow-y:auto;animation:up .25s ease-out}
.sheet h3{margin:0;font-size:19px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* avisos e instalação */
.steps{display:flex;flex-direction:column;gap:4px;padding:12px 14px}
.step{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:15px;line-height:1.4;text-align:left}
.ico{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none}
.ico svg{width:22px;height:22px}
.ico.blue{background:var(--blue-soft);color:var(--blue-ink)}.ico.teal{background:var(--teal-soft);color:var(--teal-ink)}
.ico.peach{background:var(--peach-soft);color:var(--peach-ink)}.ico.lilac{background:var(--lilac-soft);color:var(--lilac-ink)}
.ico.green{background:var(--green-soft);color:var(--green-ink)}.ico.red{background:#FDE8E4;color:var(--red-ink)}
.warn{background:var(--warn-soft);color:var(--warn-ink);border-radius:14px;padding:13px 15px;font-size:13.5px;line-height:1.4}

      const r = await fetch(`${url}/auth/v1/token?grant_type=refresh_token`, { method: 'POST', headers: { apikey: anon, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: auth.refresh }) });
      if (r.ok) { keepAuth(fromResp(await r.json())); return auth; }
      if (r.status < 500) auth = null; else throw new Error('auth ' + r.status);
    }
    const r = await fetch(`${url}/auth/v1/signup`, { method: 'POST', headers: { apikey: anon, 'Content-Type': 'application/json' }, body: JSON.stringify({ data: {} }) });
    if (!r.ok) throw new Error('signup ' + r.status);
    keepAuth(fromResp(await r.json()));
    return auth;
  }
  async function token() {
    if (!on) throw new Error('offline-config');
    if (auth?.access && auth.exp > Date.now() + 60000) return auth.access;
    if (!authP) authP = signIn().finally(() => { authP = null; });
    return (await authP).access;
  }
  async function fn(action, body = {}, needAuth = true) {
    const headers = { 'Content-Type': 'application/json', apikey: anon };
    if (needAuth) headers.Authorization = 'Bearer ' + (await token());
    const r = await fetch(`${url}/functions/v1/api`, { method: 'POST', headers, body: JSON.stringify({ action, ...body }) });
    let j = {}; try { j = await r.json(); } catch (e) {}
    if (!r.ok) { const err = new Error(j.error || 'http ' + r.status); err.code = j.error; err.status = r.status; throw err; }
    return j;
  }
  /** Envia o estado para a nuvem (o servidor lê as tarefas para mandar os avisos). */
  async function push() {
    if (!on || !S.onboarded) return;
    if (pushing) { again = true; return; }
    pushing = true;
    try {
      const tk = await token();
      const data = { ...S, chat: S.chat.slice(-40) };
      const r = await fetch(`${url}/rest/v1/states?on_conflict=user_id`, { method: 'POST', keepalive: JSON.stringify(data).length < 60000,
        headers: { apikey: anon, Authorization: 'Bearer ' + tk, 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify({ user_id: auth.uid, data, updated_at: new Date().toISOString() }) });
      if (!r.ok) throw new Error('save ' + r.status);
      U.cloudErr = false;
    } catch (e) { U.cloudErr = true; clearTimeout(pushT); pushT = setTimeout(push, 15000); }
    finally { pushing = false; if (again) { again = false; push(); } }
  }
  /** Ao abrir: pega a versão da nuvem se ela for mais nova (ex.: mudou em outra aba). */
  async function pull() {
    if (!on || !auth?.refresh) return false;
    try {
      const tk = await token();
      const r = await fetch(`${url}/rest/v1/states?select=data`, { headers: { apikey: anon, Authorization: 'Bearer ' + tk } });
      if (!r.ok) return false;
      const rows = await r.json();
      const remote = rows[0]?.data;
      if (remote && (remote.updatedAt || 0) > (S.updatedAt || 0)) { S = merge(remote); persistLocal(); return true; }
    } catch (e) {}
    return false;
  }
  return { on, fn, push, pull, token, hasAccount: () => !!auth?.refresh };
})();

/* ---------- Avisos no celular (Web Push) ---------- */
const Push = (() => {
  let reg = null;
  const ready = (async () => {
    if (!('serviceWorker' in navigator)) return null;
    try { reg = await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready; return reg; } catch (e) { return null; }
  })();
  const key = (b64) => { const p = '='.repeat((4 - (b64.length % 4)) % 4); const raw = atob((b64 + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(raw, (c) => c.charCodeAt(0)); };
  /** Estado: 'on' (avisos ligados aqui), 'off' (pode ligar), 'denied', 'install' (iPhone fora da tela de início), 'unsupported'. */
  async function state() {
    if (IS_IOS && !STANDALONE) return 'install';
    if (!PUSH_OK) return 'unsupported';
    if (permission() === 'denied') return 'denied';
    const r = await ready; if (!r) return 'unsupported';
    const sub = await r.pushManager.getSubscription().catch(() => null);
    return sub && permission() === 'granted' ? 'on' : 'off';
  }
  /** Pede permissão (precisa vir de um toque) e inscreve este celular no servidor. */
  async function enable() {
    if (!canNotifyHere()) return state();
    const p = await Notification.requestPermission();
    if (p !== 'granted') return p === 'denied' ? 'denied' : 'off';
    const r = await ready; if (!r) return 'unsupported';
    if (!vapidKey) { try { vapidKey = (await Cloud.fn('config', {}, false)).vapidPublicKey || ''; } catch (e) {} }
    if (!vapidKey) throw new Error('sem chave');
    let sub = await r.pushManager.getSubscription();
    if (!sub) sub = await r.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key(vapidKey) });
    await Cloud.fn('subscribe', { subscription: sub.toJSON() });
    S.settings.notify.enabled = true; S.stats.reminders++; save();
    return 'on';
  }
  /** Reinscreve em silêncio ao abrir (o celular pode trocar o endereço de aviso). */
  async function refresh() {
    if ((await state()) !== 'on') return;
    try { const r = await ready; const sub = await r.pushManager.getSubscription(); if (sub) await Cloud.fn('subscribe', { subscription: sub.toJSON() }); } catch (e) {}
  }
  return { state, enable, refresh, ready };
})();
async function updatePushState() { U.pushState = await Push.state(); render(true); }

  else applyProposal(reply.ops, reply.doneText || 'Pronto, está na sua agenda.', reply.date, reply.plan, reply.notes);

function snooze(id, mins) {

  const base = t.date === today() ? Math.max(t.start, L.minutesOf(new Date())) : t.start;
  const start = Math.min(base + mins, 23 * 60 + 45), dur = (t.end ?? t.start + 30) - t.start;

  S.stats.snoozed++; save(); closeSheet(); render(true);

/** Próximo dia, no primeiro horário livre perto do horário original. */
function suggestion(t) {
  const day = L.addDays(t.date < today() ? today() : t.date, 1);
  const dur = t.start != null ? (t.end ?? t.start + 30) - t.start : 30;
  const want = t.start ?? 19 * 60;
  const free = (m) => !S.tasks.some((o) => o.id !== t.id && o.date === day && o.start != null && m < L.taskEnd(o) && m + dur > o.start);
  for (let d = 0; d <= 6 * 60; d += 30) { for (const m of [want + d, want - d]) if (m >= 7 * 60 && m + dur <= 24 * 60 && free(m)) return { date: day, start: m, end: m + dur }; }

}

function openLink(href) {
  let u; try { u = new URL(href, location.href); } catch (e) { return; }
  const t = u.searchParams.get('t'), v = u.searchParams.get('v');
  if (!t && !v) return;
  S.stats.opened++; save();
  if (!S.onboarded) return;
  if (t) { U.tab = 'hoje'; render(); taskSheet(t); }
  else if (v === 'noite') { U.tab = 'hoje'; render(); nightSheet(); }
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
}
navigator.serviceWorker?.addEventListener('message', (e) => { if (e.data?.type === 'open') openLink(e.data.url); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { clearTimeout(saveT); persistLocal(); Cloud.push(); }
  else { markDay(); updatePushState(); clearNotifications(); }
});

/* ---------- Voz: falar com o Faiz e ouvir a resposta ---------- */
const Voice = (() => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, heard = '';
  const clean = (t) => String(t || '').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, '').replace(/\s+/g, ' ').trim();
  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    const t = clean(text); if (!t) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(t.slice(0, 600));
      u.lang = 'pt-BR'; u.rate = 1.05;
      const v = speechSynthesis.getVoices().find((x) => /pt[-_]BR/i.test(x.lang));
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function stop() { try { rec?.stop(); } catch (e) {} }
  function start() {
    if (U.listening) { stop(); return; }
    try { speechSynthesis?.cancel(); } catch (e) {}
    if (!SR) {
      const inp = document.getElementById('chatInput');
      inp?.focus();
      toast('Toque no microfone do teclado para ditar a mensagem.');
      return;
    }
    heard = '';
    rec = new SR();
    rec.lang = 'pt-BR'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
    rec.onresult = (e) => {
      heard = Array.from(e.results).map((r) => r[0].transcript).join(' ');
      const inp = document.getElementById('chatInput'); if (inp) inp.value = heard;
    };
    rec.onerror = (e) => {
      U.listening = false; render(true);
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') toast(IS_IOS ? 'Libere o microfone em Ajustes › Faiz (ou Safari) › Microfone. Ou use o microfone do teclado.' : 'Libere o microfone para o Faiz nas permissões do navegador.');
      else if (e.error === 'no-speech') toast('Não ouvi nada. Toque no microfone e fale de novo.');
      else if (e.error !== 'aborted') toast('O microfone não funcionou agora. Use o microfone do teclado.');
    };
    rec.onend = () => {
      U.listening = false;
      const t = heard.trim(); heard = '';
      const inp = document.getElementById('chatInput'); if (inp) inp.value = '';
      render(true);
      if (t) send(t, { voice: true });
    };
    try { rec.start(); U.listening = true; S.stats.voice = (S.stats.voice || 0) + 1; render(true); }
    catch (e) { U.listening = false; toast('O microfone não funcionou agora. Use o microfone do teclado.'); }
  }
  return { start, stop, speak, supported: !!SR };
})();

/* ---------- Lugares perto ---------- */
const fmtDist = (m) => (m < 1000 ? `${Math.max(10, Math.round(m / 10) * 10)} m` : `${(m / 1000).toFixed(1).replace('.', ',')} km`);
function routeUrl(p) {
  return IS_IOS
    ? `https://maps.apple.com/?daddr=${p.lat},${p.lon}&q=${encodeURIComponent(p.nome)}`
    : `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}`;
}
function getPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject({ code: 'unsupported' });
    navigator.geolocation.getCurrentPosition((p) => resolve(p.coords), (e) => reject({ code: e.code === 1 ? 'denied' : 'unavailable' }), { enableHighAccuracy: false, timeout: 12000, maximumAge: 300000 });
  });
}
async function findNearby(nb, voice) {
  U.typing = true; render(true);
  let msg;
  try {
    const c = await getPosition();
    const { places } = await Cloud.fn('nearby', { lat: c.latitude, lon: c.longitude, termo: nb.termo, osm: nb.osm });
    msg = places?.length
      ? { who: 'bot', mood: 'oculos', text: places.length === 1 ? `Achei 1 ${nb.termo} perto de você:` : `Achei ${places.length} opções de ${nb.termo} perto de você. A mais próxima fica a ${fmtDist(places[0].dist)}:`, places }
      : { who: 'bot', mood: 'cansada', text: `Não achei ${nb.termo} num raio de 8 km de você. Quer que eu procure outra coisa?` };
    S.stats.nearby = (S.stats.nearby || 0) + 1;
  } catch (e) {
    msg = { who: 'bot', mood: 'cansada', text: e?.code === 'denied'
      ? `Preciso da sua localização para achar ${nb.termo} perto de você. ${IS_IOS ? 'Libere em Ajustes › Privacidade › Serviços de Localização › Safari (Sites) e tente de novo.' : 'Libere a localização para este site e tente de novo.'}`
      : e?.code === 'unavailable' || e?.code === 'unsupported' ? 'Não consegui pegar sua localização agora. Confira se o GPS está ligado e tente de novo.'
      : 'Não consegui buscar os lugares agora. Tente de novo em instantes.' };
  }
  U.typing = false;
  push(msg);
  if (voice || S.settings.speak) Voice.speak(msg.places?.length ? `${msg.text.split(':')[0]}. ${msg.places[0].nome}.` : msg.text);
  U.scrollChat = true; render(true);
}

function progressRing(st, size = 58) {

    const bubble = (m) => {
      if (m.who === 'me') return `<div class="msg me">${esc(m.text)}</div>`;
      const pending = m.proposal?.status === 'pending';
      const undoable = m.undo && !m.undo.done;
      const acts = [];
      if (pending) acts.push(`<button class="pill navy" type="button" data-act="confirm" data-id="${m.id}">Confirmar</button>`, `<button class="pill" type="button" data-act="adjust" data-id="${m.id}">Ajustar</button>`);
      const rp = undoable ? remindPill(m) : '';
      if (rp) acts.push(rp);
      if (undoable && m.date) acts.push(`<button class="pill" type="button" data-act="day" data-v="${m.date}">Ver na agenda</button>`);
      if (undoable) acts.push(`<button class="pill" type="button" data-act="undo" data-id="${m.id}">Desfazer</button>`);
      (m.links || []).forEach((l) => acts.push(`<button class="pill" type="button" data-act="${l.href.startsWith('agenda:') ? 'day' : 'tab'}" data-v="${esc(l.href.startsWith('agenda:') ? l.href.slice(7) : l.href === '/' ? 'hoje' : 'agenda')}">${esc(l.label)}</button>`));
      return `<div class="botrow">${irisImg(m.mood || 'principal', 34)}<div class="msg bot">${esc(m.text)}${m.plan?.length ? `<div class="plan">${m.plan.map((p) => `<div><b>${L.fmtTime(p.start)}</b><i style="background:${COLORS[p.color] || 'var(--lilac)'}"></i><span>${esc(p.title)}</span>${p.isNew ? '<small>novo</small>' : ''}</div>`).join('')}</div>` : ''}${m.places?.length ? `<div class="places">${m.places.map((p) => `<div class="place"><span class="ico peach" style="width:34px;height:34px;border-radius:11px">${I.pin.replace('<svg', '<svg width="18" height="18"')}</span><div class="txt"><div class="n">${esc(p.nome)}</div><div class="d">${fmtDist(p.dist)}${p.endereco ? ' · ' + esc(p.endereco) : ''}</div></div><a class="pill" href="${esc(routeUrl(p))}" target="_blank" rel="noopener">Como chegar</a></div>`).join('')}</div>` : ''}${m.notes ? `<div class="note">${esc(m.notes)}</div>` : ''}${m.proposal?.status === 'adjusted' ? '<div class="note">Plano não aplicado.</div>' : ''}${acts.length ? `<div class="acts">${acts.join('')}</div>` : ''}</div></div>`;
    };
    return `<main class="screen bg-peach" style="padding-bottom:0">
      <div class="head"><span>${irisImg('principal', 44)}</span><div style="text-align:center"><h1 class="screen-title">Íris</h1><div class="meta">sua governanta no Faiz</div></div><span></span></div>
      ${U.aiState === 'off' ? '<p class="ai-note">Modo simples: a IA não está disponível agora, então entendo frases mais diretas.</p>' : ''}${U.pushState !== 'on' && U.pushState !== 'checking' ? `<p class="ai-note">Avisos desligados neste celular. <button class="textbtn" type="button" data-act="notify" style="font-size:12.5px;padding:0">Ativar</button></p>` : ''}
      <div class="chat" id="chat" style="padding-top:6px">
        <div class="botrow">${irisImg('principal', 34)}<div class="msg bot">${intro}</div></div>
        ${S.chat.map(bubble).join('')}
        ${U.typing ? '<div class="typing"><span><i style="background:var(--blue)"></i> <i></i> <i></i></span>Analisando sua agenda...</div>' : ''}
      </div>
    </main>
    <div class="composer">
      <div class="sugs">${['Quero correr na quinta depois da academia e depois tenho um jantar', 'Organize meu dia', 'Tenho horário livre amanhã?', 'Lembre-me de beber água às 15h', 'Padaria mais próxima de mim'].map((s) => `<button type="button" data-act="say" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div>
      <form class="inputbox" id="chatForm"><input id="chatInput" type="text" enterkeyhint="send" autocomplete="off" placeholder="${U.listening ? 'Ouvindo...' : 'Escreva ou toque no microfone'}" aria-label="Mensagem para o Faiz" maxlength="500"><button type="button" class="mic ${U.listening ? 'on' : ''}" data-act="mic" aria-label="${U.listening ? 'Parar de ouvir' : 'Falar com o Faiz'}" aria-pressed="${U.listening}" ${U.typing ? 'disabled' : ''}>${I.mic}</button><button type="submit" aria-label="Enviar" ${U.typing ? 'disabled' : ''}>${I.send}</button></form>
    </div>`;
  },
  tarefas() {
    const f = U.tfilter, td = today(), tm = L.addDays(td, 1);
    const list = S.tasks.filter((t) => (f === 'todas' ? true : f === 'feitas' ? t.status === 'feito' : t.status !== 'feito')).sort(L.byTime);
    const groups = [['Atrasadas', list.filter((t) => t.date < td && t.status !== 'feito')], ['Hoje', list.filter((t) => t.date === td)], ['Amanhã', list.filter((t) => t.date === tm)], ['Próximos dias', list.filter((t) => t.date > tm)], ['Anteriores', list.filter((t) => t.date < td && t.status === 'feito')]];
    const tab = (k, l) => `<button type="button" role="tab" aria-selected="${f === k}" data-act="tfilter" data-v="${k}">${l}</button>`;
    return `<main class="screen bg-lav">
      <div class="head"><span></span><h1 class="screen-title">Tarefas</h1><button class="round" type="button" data-act="newtask" aria-label="Nova tarefa">${I.plus}</button></div>
      <div class="tabs" role="tablist" style="margin-top:14px">${tab('pendentes', 'Pendentes')}${tab('feitas', 'Concluídas')}${tab('todas', 'Todas')}</div>
      ${groups.map(([g, ts]) => ts.length ? `<div class="label" ${g === 'Atrasadas' ? 'style="color:var(--red-ink)"' : ''}>${g}</div><div class="list">${ts.map((t) => taskCard(t, { del: true, showDay: g !== 'Hoje' })).join('')}</div>` : '').join('')}
      ${list.length ? '' : `<p class="muted" style="text-align:center;margin-top:60px">${f === 'feitas' ? 'Nenhuma tarefa concluída ainda.' : 'Nada por aqui.<br>Toque em + para criar uma tarefa, ou peça ao Faiz.'}</p>`}
    </main>`;
  },
  mais() {
    const st = S.stats;
    return `<main class="screen bg-lav">
      <div class="head"><span></span><h1 class="screen-title">Mais</h1><span></span></div>
      <div class="label">Avisos no celular</div>
      ${avisosCard()}
      <div class="label">Teste do Faiz</div>
      <div class="card">
        <button class="setrow" type="button" data-act="feedback"><div class="txt"><div class="t">Dar minha opinião</div><div class="meta">Leva 1 minuto e ajuda muito.</div></div><span class="pill navy">Abrir</span></button>
        ${U.owner
          ? `<div class="setrow"><div class="txt"><div class="t">Alertas do teste</div><div class="meta">Ligados neste celular. Você recebe um aviso se o crédito da IA acabar.</div></div></div>${!U.aiCredit ? '<div style="padding:0 16px 14px"><div class="warn"><b>Crédito da IA acabou.</b> A Íris está no modo simples. Recarregue em console.anthropic.com › Billing.</div></div>' : ''}`
          : `<button class="setrow" type="button" data-act="owner"><div class="txt"><div class="t">Receber alertas do teste</div><div class="meta">Só para quem organiza o teste.</div></div><span class="pill">Ativar</span></button>`}
        <div class="setrow"><div class="txt"><div class="t">Seu uso até agora</div><div class="meta num">${plural(st.days.length, 'dia', 'dias')} · ${plural(st.requests, 'pedido', 'pedidos')} ao Faiz · ${plural(st.confirmed, 'plano confirmado', 'planos confirmados')}</div></div></div>
      </div>
      <div class="label">Preferências</div>
      <div class="card">
        <div class="setrow"><div class="txt"><label class="t" for="nameEdit">Seu nome</label><input id="nameEdit" class="field" style="margin-top:6px;padding:9px 12px" maxlength="40" value="${esc(S.name)}"></div></div>
        <div class="setrow"><div class="txt"><div class="t">Ler as respostas em voz alta</div><div class="meta">${S.settings.speak ? 'Ligado: a Íris fala todas as respostas.' : 'Desligado: a Íris só fala quando você usa o microfone.'}</div></div><button class="toggle" type="button" role="switch" aria-checked="${!!S.settings.speak}" aria-label="Ler as respostas em voz alta" data-act="speak"></button></div>
        <div class="setrow"><div class="txt"><div class="t">Perguntar antes de mexer na agenda</div><div class="meta">${S.settings.askBefore ? 'Você confirma cada plano antes de entrar na agenda.' : 'O Faiz agenda direto e oferece Desfazer.'}</div></div><button class="toggle" type="button" role="switch" aria-checked="${S.settings.askBefore}" aria-label="Perguntar antes de mexer na agenda" data-act="askbefore"></button></div>
        <div class="setrow"><div class="txt"><div class="t">Inteligência da Íris</div><div class="meta">${!U.aiCredit ? 'Sem crédito agora. A Íris responde no modo simples, com frases mais diretas.' : U.aiState === 'ready' && U.aiOn ? 'Ligada.' : U.aiState === 'loading' ? 'Verificando...' : 'Indisponível agora. A Íris entende frases mais diretas.'}</div></div></div>
      </div>
      <div class="label">Seus dados</div>
      <div class="card">
        <button class="setrow" type="button" data-act="clearchat"><div class="txt"><div class="t">Apagar conversa com a Íris</div></div></button>
        <button class="setrow" type="button" data-act="reset"><div class="txt"><div class="t" style="color:var(--red-ink);font-weight:600">Apagar todos os meus dados</div><div class="meta">Tarefas, conversa e avisos deste celular.</div></div></button>
      </div>
      <p class="meta" style="text-align:center;margin-top:22px">Faiz · versão de teste${U.cloudErr ? ' · sem conexão com a nuvem agora' : ''}</p>
    </main>`;
  },
};

function nav() {
  const b = (k, ic, l) => `<button type="button" data-act="tab" data-v="${k}" ${U.tab === k ? 'aria-current="page"' : ''}>${I[ic]}<span>${l}</span></button>`;
  return `<nav class="nav" aria-label="Navegação">${b('hoje', 'home', 'Hoje')}${b('agenda', 'cal', 'Agenda')}<button type="button" class="center" data-act="tab" data-v="faz" aria-label="Falar com a Íris" ${U.tab === 'faz' ? 'aria-current="page"' : ''}><span class="ring">${LOGO}</span></button>${b('tarefas', 'tasks', 'Tarefas')}${b('mais', 'more', 'Mais')}</nav>`;
}

function render(keep) {
  const y = window.scrollY;
  const draft = document.getElementById('chatInput')?.value;
  const tlY = document.getElementById('tlWrap')?.scrollTop;
  const pre = U.showInstall || (IS_IOS && !STANDALONE && !S.skipInstall && !S.onboarded) ? 'install'
    : !S.onboarded ? 'welcome'
    : (!S.permAsked && canNotifyHere() && permission() === 'default') ? 'permit' : '';
  if (pre) { $app.innerHTML = screens[pre](); return; }
  $app.innerHTML = screens[U.tab]() + nav();
  if (U.tab === 'faz') {
    const inp = document.getElementById('chatInput');
    if (draft) inp.value = draft;
    document.getElementById('chatForm').addEventListener('submit', (e) => { e.preventDefault(); const v = inp.value; inp.value = ''; send(v); });
    if (U.scrollChat) { U.scrollChat = false; requestAnimationFrame(() => window.scrollTo(0, document.body.scrollHeight)); }
    else if (keep) window.scrollTo(0, y);
  } else if (keep) window.scrollTo(0, y);
  if (U.tab === 'agenda') {
    const w = document.getElementById('tlWrap');
    if (keep && tlY != null) w.scrollTop = tlY;
    else { const sel = U.agenda, ev = S.tasks.filter((t) => t.date === sel && t.start != null).sort((a, b) => a.start - b.start)[0]; const target = sel === today() ? L.minutesOf(new Date()) - 90 : (ev?.start ?? 540) - 30; w.scrollTop = Math.max(0, (target / 60 - 6) * 64); }
  }
  if (U.tab === 'mais') {
    const ne = document.getElementById('nameEdit');
    ne.addEventListener('change', () => { S.name = ne.value.trim(); save(); toast('Nome salvo'); });
  }
}

/* ---------- Folhas ---------- */
function newTaskSheet() {
  let cat = 'pessoal', off = 0;
  const days = [0, 1, 2].map((o) => L.dayLabel(L.addDays(today(), o), today()));
  sheet(`<h3>Nova tarefa</h3>
    <label class="flabel" for="ntTitle">O que você precisa fazer?<input class="field" id="ntTitle" maxlength="80" placeholder="Ex.: Buscar exame no laboratório"></label>
    <div class="flabel">Categoria<div class="seg" id="ntCat"><button type="button" aria-pressed="true" data-v="pessoal">Pessoal</button><button type="button" aria-pressed="false" data-v="trabalho">Trabalho</button></div></div>
    <div class="flabel">Quando<div class="seg" id="ntDay">${days.map((d, i) => `<button type="button" aria-pressed="${i === 0}" data-v="${i}">${esc(d)}</button>`).join('')}</div></div>
    <label class="flabel" for="ntTime">Horário (opcional)<input class="field" id="ntTime" type="time"></label>
    <p class="err" id="ntErr" hidden>Escreva o nome da tarefa.</p>
    <div class="row"><button class="btn light" type="button" id="ntCancel" style="flex:1">Cancelar</button><button class="btn" type="button" id="ntSave" style="flex:2">Criar tarefa</button></div>`, (el) => {
    const seg = (id, fn) => el.querySelector(id).addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; el.querySelectorAll(id + ' button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); fn(b.dataset.v); });
    seg('#ntCat', (v) => (cat = v)); seg('#ntDay', (v) => (off = +v));
    el.querySelector('#ntCancel').onclick = closeSheet;
    el.querySelector('#ntSave').onclick = () => {
      const title = el.querySelector('#ntTitle').value.trim();
      if (!title) { el.querySelector('#ntErr').hidden = false; return; }
      const tm = el.querySelector('#ntTime').value;
      const start = tm ? +tm.split(':')[0] * 60 + +tm.split(':')[1] : undefined;
      const undo = applyOps([{ type: 'add', task: { title: L.cap(title), date: L.addDays(today(), off), start, end: start != null ? start + 30 : undefined, category: cat, color: cat === 'trabalho' ? 'blue' : 'lilac' } }]);
      closeSheet(); render(true);
      toast('Tarefa criada', { label: 'Desfazer', run: () => { applyOps(undo); render(true); } });
    };
    setTimeout(() => el.querySelector('#ntTitle').focus(), 60);
  });
}
function feedbackSheet() {
  let nota = 0;
  sheet(`<h3>O que você está achando do Faiz?</h3>
    <div class="flabel">De 1 a 5, quanto o Faiz te ajudou?<div class="stars" id="fbStars">${[1, 2, 3, 4, 5].map((n) => `<button type="button" aria-pressed="false" data-v="${n}">${n}</button>`).join('')}</div></div>
    <label class="flabel" for="fbText">Conte o que funcionou, o que faltou ou o que irritou<textarea class="field" id="fbText" maxlength="1500" placeholder="Ex.: gostei de montar a semana, mas queria que lembrasse de beber água"></textarea></label>
    <p class="err" id="fbErr" hidden>Escolha uma nota ou escreva um comentário.</p>
    <div id="fbSend"></div>
    <button class="btn light" type="button" data-close-sheet>Fechar</button>`, (el) => {
    el.querySelector('[data-close-sheet]').onclick = closeSheet;
    const out = el.querySelector('#fbSend');
    const msg = () => {
      const st = S.stats; const t = el.querySelector('#fbText').value.trim();
      return `Opinião sobre o Faiz${S.name ? ' — ' + S.name : ''}\nNota: ${nota || '-'} de 5\n${t ? 'Comentário: ' + t + '\n' : ''}\nUso: ${plural(st.days.length, 'dia', 'dias')}, ${plural(st.requests, 'pedido', 'pedidos')}, ${st.confirmed} confirmados, ${st.adjusted} ajustados, ${st.undone} desfeitos, ${st.tasksDone} tarefas concluídas, avisos ${U.pushState === 'on' ? 'ligados' : 'desligados'}, ${st.opened} avisos abertos, ${st.snoozed} adiados, IA ${st.ai} ok / ${st.aiFail} sem IA, voz ${st.voice || 0}, lugares ${st.nearby || 0}. ${IS_IOS ? 'iPhone' : /Android/.test(UA) ? 'Android' : 'outro aparelho'}${STANDALONE ? ' (tela de início)' : ''}.`;
    };
    const draw = () => {
      const ready = nota || el.querySelector('#fbText').value.trim();
      const m = msg();
      out.innerHTML = waNumber
        ? `<a class="btn ${ready ? '' : 'light'}" href="${ready ? 'https://wa.me/' + esc(waNumber.replace(/\D/g, '')) + '?text=' + encodeURIComponent(m) : '#'}" target="_blank" rel="noopener" id="fbGo">Enviar pelo WhatsApp</a>`
        : `<div class="flabel">Copie e mande para quem te convidou<textarea class="field" readonly id="fbOut" style="height:130px">${esc(m)}</textarea></div><button class="btn" type="button" id="fbCopy">Copiar texto</button>`;
      const go = out.querySelector('#fbGo');
      if (go) go.addEventListener('click', (e) => { if (!ready) { e.preventDefault(); el.querySelector('#fbErr').hidden = false; } else toast('Abrindo o WhatsApp. Obrigado!'); });
      const cp = out.querySelector('#fbCopy');
      if (cp) cp.onclick = () => { const ta = out.querySelector('#fbOut'); navigator.clipboard?.writeText(ta.value).then(() => toast('Copiado'), () => { ta.select(); toast('Selecionei o texto: copie e cole no WhatsApp'); }); };
    };
    el.querySelector('#fbStars').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; nota = +b.dataset.v; el.querySelectorAll('#fbStars button').forEach((x) => x.setAttribute('aria-pressed', String(+x.dataset.v === nota))); el.querySelector('#fbErr').hidden = true; draw(); });
    el.querySelector('#fbText').addEventListener('input', () => { el.querySelector('#fbErr').hidden = true; draw(); });
    draw();
  });
}
function ownerSheet() {
  sheet(`<h3>Alertas do teste</h3>
    <p class="muted" style="margin:0">Para receber neste celular os alertas do teste (como o crédito da IA acabando), digite o seu WhatsApp, o mesmo que recebe as opiniões.</p>
    <label class="flabel" for="owWa">Seu WhatsApp com DDD<input class="field" id="owWa" inputmode="tel" maxlength="24" placeholder="(61) 99999-8888"></label>
    <p class="err" id="owErr" hidden></p>
    <div class="row"><button class="btn light" type="button" id="owNo" style="flex:1">Cancelar</button><button class="btn" type="button" id="owYes" style="flex:2">Ativar alertas</button></div>`, (el) => {
    el.querySelector('#owNo').onclick = closeSheet;
    el.querySelector('#owYes').onclick = async () => {
      const err = el.querySelector('#owErr');
      try {
        await Cloud.fn('owner', { whatsapp: el.querySelector('#owWa').value });
        U.owner = true; closeSheet(); render(true);
        toast(U.pushState === 'on' ? 'Pronto! Os alertas do teste vão chegar neste celular.' : 'Pronto! Ative os avisos em Mais para os alertas chegarem.');
      } catch (e) {
        err.hidden = false;
        err.textContent = e?.code === 'not_owner' ? 'Esse não é o número de quem organiza o teste.' : 'Não consegui agora. Confira a internet e tente de novo.';
      }
    };
    setTimeout(() => el.querySelector('#owWa').focus(), 60);
  });
}
function confirmSheet(title, body, okLabel, onOk) {
  sheet(`<h3>${esc(title)}</h3><p class="muted" style="margin:0">${esc(body)}</p><div class="row"><button class="btn light" type="button" id="cfNo" style="flex:1">Cancelar</button><button class="btn" type="button" id="cfYes" style="flex:1;background:var(--red-strong)">${esc(okLabel)}</button></div>`, (el) => {
    el.querySelector('#cfNo').onclick = closeSheet;
    el.querySelector('#cfYes').onclick = () => { closeSheet(); onOk(); };
  });
}

/* ---------- Ações ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || !$app.contains(el)) return;
  const a = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  switch (a) {
    case 'start': { const n = document.getElementById('nameInput').value.trim(); S.name = n; S.onboarded = true; save(); U.tab = 'hoje'; render(); window.scrollTo(0, 0); break; }
    case 'skipinstall': S.skipInstall = true; U.showInstall = false; save(); render(); window.scrollTo(0, 0); break;
    case 'showinstall': U.showInstall = true; render(); window.scrollTo(0, 0); break;
    case 'permit': case 'notify': enableNotify(a === 'permit'); break;
    case 'later': S.permAsked = true; save(); render(); window.scrollTo(0, 0); toast('Tudo bem. Você pode ativar os avisos em Mais.'); break;
    case 'testpush': testPush(); break;
    case 'lead': S.settings.notify.lead = +v; save(); render(true); toast(`Vou te avisar ${v} minutos antes`); break;
    case 'morning': S.settings.notify.morning = S.settings.notify.morning ? null : '07:30'; save(); render(true); break;
    case 'night': S.settings.notify.night = S.settings.notify.night ? null : '21:00'; save(); render(true); break;
    case 'done': { const t = S.tasks.find((x) => x.id === id); closeSheet(); if (t && t.status !== 'feito') toggleTask(id); break; }
    case 'snooze': snooze(id, +v || 15); break;
    case 'resched': reschedule(id); break;
    case 'tab': U.tab = v; if (v === 'faz') U.scrollChat = true; render(); if (v !== 'faz') window.scrollTo(0, 0); break;
    case 'filter': U.filter = v; render(true); break;
    case 'tfilter': U.tfilter = v; render(true); break;
    case 'toggle': toggleTask(id); break;
    case 'del': removeTask(id); break;
    case 'day': U.agenda = v; U.tab = 'agenda'; render(); window.scrollTo(0, 0); break;
    case 'week': U.agenda = L.addDays(U.agenda, +v); render(); break;
    case 'say': U.tab = 'faz'; render(); send(v); break;
    case 'confirm': confirmMsg(id); break;
    case 'adjust': adjustMsg(id); break;
    case 'undo': undoMsg(id); break;
    case 'newtask': newTaskSheet(); break;
    case 'feedback': feedbackSheet(); break;
    case 'owner': ownerSheet(); break;
    case 'askbefore': S.settings.askBefore = !S.settings.askBefore; save(); render(true); break;
    case 'mic': Voice.start(); break;
    case 'speak': S.settings.speak = !S.settings.speak; save(); render(true); if (S.settings.speak) Voice.speak('Pronto, vou ler as respostas em voz alta.'); break;
    case 'clearchat': confirmSheet('Apagar a conversa?', 'As mensagens com o Faiz somem deste celular. Suas tarefas continuam.', 'Apagar', () => { S.chat = []; save(); render(true); toast('Conversa apagada'); }); break;
    case 'reset': confirmSheet('Apagar todos os seus dados?', 'Tarefas, conversa e seu nome serão apagados deste celular. Não dá para desfazer.', 'Apagar tudo', () => { const st = S.stats; S = fresh(); S.stats = st; save(); U.tab = 'hoje'; render(); toast('Dados apagados'); }); break;
  }
});

/* Atualiza o "agora" e vira o dia sozinho */
setInterval(() => { markDay(); if (U.tab === 'agenda' || U.tab === 'hoje') render(true); }, 60000);
render();
openLink(location.href);
clearNotifications();
</script>

</html>
