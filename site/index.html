<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Faiz</title>
<meta name="description" content="Faiz: diga o que precisa, ele organiza e te lembra.">
<meta name="theme-color" content="#E8E7FC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Faiz">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap">
<style>
/* Layout: uma coluna de app (até 480 px) com barra inferior fixa; tema claro único, como o sistema de design do Faiz. */
:root{
  color-scheme:light;
  --navy:#0C2A48; --on-navy:#FFFFFF; --teal:#2EC4B6; --teal-soft:#E6F7F4; --teal-ink:#0F7A70;
  --ground:#F6F6FB; --surface:#FFFFFF; --sunken:#F6F7FC; --chip:#F1F1F8; --line:#E6E7F0; --line-strong:#C9CDF7;
  --ink:#1A1D2E; --ink-muted:#5F6478; --ink-subtle:#A3A7B7; --ink-inverse:#16182A;
  --blue:#6F7FF0; --blue-soft:#EEF0FE; --blue-ink:#4453C8; --green:#6FD3A6; --green-soft:#E3F7EE; --green-ink:#237A54;
  --peach:#F2A385; --peach-soft:#FDEDE6; --peach-ink:#A84B2B; --lilac:#B7A6F0; --lilac-soft:#F1ECFD; --lilac-ink:#6A4CC8;
  --red:#F0644A; --red-strong:#C9381F; --red-ink:#B93A22; --warn-soft:#FFF4DA; --warn-ink:#8A5E00; --toggle-off:#C4C7D6;
  --g-lav:#D9DAFB; --g-lav-mid:#E8E7FC; --g-peach:#F9E1D6; --g-rose:#F4E5EC;
  --sh-card:0 10px 30px -18px rgba(60,66,120,.35); --sh-float:0 6px 16px -10px rgba(60,66,120,.5);
  --sh-nav:0 -8px 30px -12px rgba(60,66,120,.18); --sh-brand:0 10px 24px -10px rgba(12,42,72,.45);
  --f-ui:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --gutter:max(20px,env(safe-area-inset-left,0px));
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#E9E9F4;color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
[hidden]{display:none!important}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:var(--ground);overflow-x:hidden}
.screen{min-height:100vh;min-height:100dvh;padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(128px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.bg-lav{background:linear-gradient(180deg,var(--g-lav) 0,var(--g-lav-mid) 220px,var(--ground) 440px)}
.bg-soft{background:linear-gradient(180deg,var(--g-lav-mid) 0,#F2F2FB 200px,var(--ground) 520px)}
.bg-peach{background:linear-gradient(180deg,var(--g-peach) 0,var(--g-rose) 40%,var(--g-lav-mid) 100%)}
.bg-welcome{background:linear-gradient(180deg,var(--g-lav) 0,#EDE8F7 50%,#F9E6DD 100%)}

/* tipografia */
.greeting{font-size:31px;font-weight:600;letter-spacing:-.02em;margin:2px 0 0;line-height:1.15;text-wrap:balance}
.title{font-size:21px;font-weight:600;letter-spacing:-.01em;margin:0}
.screen-title{font-size:19px;font-weight:600;margin:0;text-align:center;flex:1}
.meta{font-size:13.5px;color:var(--ink-muted)}
.label{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-muted);margin:24px 0 10px}
.muted{color:var(--ink-muted)}
.num{font-variant-numeric:tabular-nums}

/* blocos */
.row{display:flex;align-items:center;gap:12px}
.head{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;margin-bottom:8px}
.round{width:46px;height:46px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;box-shadow:var(--sh-float);padding:0}
.round svg{width:21px;height:21px}
.rate{width:46px;height:46px;border-radius:50%;border:3px solid var(--surface);background:var(--surface);display:grid;place-items:center;box-shadow:var(--sh-float);padding:0;color:var(--navy)}
.rate svg{width:28px;height:28px;display:block}
.avatar{width:46px;height:46px;border-radius:50%;border:3px solid var(--surface);background:var(--blue);color:#fff;font-weight:700;font-size:18px;display:grid;place-items:center;box-shadow:var(--sh-float);padding:0}
.card{background:var(--surface);border-radius:24px;box-shadow:var(--sh-card)}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.45);padding:5px;border-radius:999px;margin:22px 0 20px}
.tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 0;color:var(--ink-muted);font-size:14.5px}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 4px 12px -8px rgba(60,66,120,.5)}
.list{display:flex;flex-direction:column;gap:12px}
.task{display:flex;align-items:center;gap:14px;padding:16px 16px 16px 18px}
.task .bar{width:4px;align-self:stretch;border-radius:3px;flex:none}
.task .txt{flex:1;min-width:0;cursor:pointer}
.task .t{font-weight:500;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.task .s{font-size:13.5px;color:var(--ink-muted);margin-top:2px;font-variant-numeric:tabular-nums}
.task.done .t{color:var(--ink-subtle);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.tag{display:inline-block;white-space:nowrap;font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 6px;margin-top:3px}
.tag.faz{color:var(--teal-ink);background:var(--teal-soft)}
.tag.blue{color:var(--blue-ink);background:var(--blue-soft)}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);flex:none;display:grid;place-items:center;padding:0;position:relative}
.chk::after{content:"";position:absolute;inset:-8px}
.chk.on{background:var(--blue);border-color:var(--blue)}
.chk svg{width:15px;height:15px;color:#fff}
.del{width:30px;height:30px;border-radius:50%;border:0;background:var(--chip);display:grid;place-items:center;color:var(--ink-muted);flex:none;padding:0}
.del svg{width:14px;height:14px}
.prog{display:flex;align-items:center;gap:14px;padding:16px}
.stat{font-size:12px;color:var(--ink-muted);line-height:1.3;white-space:nowrap}
.stat b{display:flex;align-items:center;gap:5px;color:var(--ink);font-size:13px;font-weight:600}
.stat i{width:7px;height:7px;border-radius:50%;display:inline-block}
.empty{text-align:center;padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:8px}
.spark{width:56px;height:56px;border-radius:18px;background:var(--teal-soft);color:var(--teal-ink);display:grid;place-items:center}
.idea{display:block;width:100%;text-align:left;border:0;background:var(--surface);border-radius:18px;padding:13px 16px;box-shadow:var(--sh-card);font-size:15px}
.btn{border:0;border-radius:18px;padding:15px 18px;font-weight:600;font-size:16px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-decoration:none}
.btn.light{background:var(--chip);color:var(--ink)}
.btn.white{background:var(--surface);color:var(--ink);box-shadow:var(--sh-float)}
.btn:disabled{opacity:.45}
.textbtn{border:0;background:none;color:var(--blue-ink);font-weight:600;font-size:14px;padding:6px 0}
.pill{border:0;border-radius:999px;padding:8px 14px;background:var(--blue-soft);color:var(--blue-ink);font-weight:600;font-size:13.5px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.pill.navy{background:var(--navy);color:#fff}

/* barra inferior */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;height:calc(84px + env(safe-area-inset-bottom,0px));padding:12px max(10px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(10px,env(safe-area-inset-left,0px));background:var(--surface);border-radius:30px 30px 0 0;box-shadow:var(--sh-nav);display:grid;grid-template-columns:repeat(5,1fr);align-items:start;z-index:20}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--ink-muted);padding:4px 0}
.nav button svg{width:24px;height:24px}
.nav button[aria-current=page]{color:var(--blue-ink);font-weight:600}
.nav button[aria-current=page] svg{color:var(--blue)}
.nav .center{margin-top:-38px}
.nav .ring{width:74px;height:74px;border-radius:24px;background:var(--surface);display:grid;place-items:center;box-shadow:var(--sh-brand)}
.nav .center[aria-current=page] .ring{box-shadow:0 0 0 3px var(--teal),var(--sh-brand)}
.nav .ring svg{width:58px;height:58px}

/* agenda */
.month{display:flex;align-items:center;justify-content:space-between;margin:12px 0 16px}
.month b{font-size:24px;font-weight:600;letter-spacing:-.01em}
.arrow{border:0;background:none;width:32px;height:32px;display:grid;place-items:center;color:var(--ink-muted);padding:0}
.arrow svg{width:20px;height:20px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.week .wd{font-size:13px;color:var(--ink-muted);margin-bottom:8px}
.week button{width:40px;height:40px;max-width:100%;margin:0 auto;border-radius:50%;border:0;background:var(--surface);font-size:16px;font-weight:500;position:relative;font-variant-numeric:tabular-nums;padding:0}
.week button.past{color:var(--ink-muted);background:rgba(255,255,255,.55)}
.week button.sel{background:var(--ink-inverse);color:#fff}
.week button.has::after{content:"";position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--red)}
.tl-wrap{margin-top:16px;height:calc(100dvh - 330px);min-height:320px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.tl-wrap::-webkit-scrollbar{display:none}
.timeline{position:relative}
.hour{height:64px;border-top:1px solid var(--line);position:relative}
.hour span{position:absolute;top:-9px;left:0;font-size:11.5px;color:var(--ink-muted);background:var(--ground);padding-right:6px;font-variant-numeric:tabular-nums}
.ev{position:absolute;left:52px;right:0;border-radius:18px;background:var(--surface);padding:9px 12px;display:flex;justify-content:space-between;gap:8px;box-shadow:var(--sh-card);overflow:hidden;border-left:4px solid var(--blue)}
.ev .t{font-size:14.5px;font-weight:500;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .s{font-size:12px;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.ev{cursor:pointer}
.ev.done{opacity:.6}
.ev .chk{width:22px;height:22px}
.ev .chk svg{width:12px;height:12px}
/* atividades que se encostam ficam lado a lado, como um bloco só dividido */
.ev.col{left:auto;right:auto;padding:8px 8px 8px 10px;gap:6px}
.ev.col.mid-l{border-top-left-radius:8px;border-bottom-left-radius:8px}
.ev.col.mid-r{border-top-right-radius:8px;border-bottom-right-radius:8px}
.ev.col .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:13.5px;line-height:1.2;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.ev.col .s{font-size:11.5px}
.ev.col.short .s{display:none}
.now{position:absolute;left:44px;right:0;height:2px;background:var(--red);z-index:3}
.now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.now span{position:absolute;left:-46px;top:-9px;font-size:11px;font-weight:700;color:var(--red-ink);background:var(--ground);padding-right:3px;font-variant-numeric:tabular-nums}

/* assistente */
.chat{display:flex;flex-direction:column;gap:12px;padding-bottom:calc(230px + env(safe-area-inset-bottom,0px))}
.msg{max-width:88%;padding:13px 16px;border-radius:22px;font-size:15px;line-height:1.45;white-space:pre-line;overflow-wrap:anywhere}
.msg.bot{background:var(--surface);border-top-left-radius:8px;box-shadow:var(--sh-card)}
.msg.me{background:var(--ink-inverse);color:#fff;align-self:flex-end;border-top-right-radius:8px}
.plan{margin-top:10px;display:flex;flex-direction:column;gap:6px;white-space:normal}
.plan div{display:flex;gap:10px;align-items:center;background:var(--sunken);border-radius:12px;padding:8px 10px;font-size:14px}
.plan b{font-variant-numeric:tabular-nums;font-weight:700;color:var(--blue-ink);width:44px;flex:none}
.plan i{width:4px;align-self:stretch;border-radius:2px;flex:none}
.plan span{flex:1;min-width:0}
.plan small{margin-left:auto;color:var(--ink-muted);font-size:12px;white-space:nowrap;flex:none}
.note{margin-top:10px;font-size:14px;color:var(--ink-muted)}
.acts{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;white-space:normal}
.typing{display:flex;align-items:center;gap:10px;color:var(--ink-muted);font-size:14.5px}
.typing i{width:6px;height:6px;border-radius:50%;display:inline-block;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s;background:var(--peach)!important}
.typing i:nth-child(3){animation-delay:.3s;background:var(--lilac)!important}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.onbpasso{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.02em;color:var(--navy,#0C2A48);background:rgba(255,255,255,.7);border-radius:999px;padding:5px 12px;margin-bottom:14px}
body.onb .composer{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
body.onb .composer .btn{width:100%}
.composer{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:480px;bottom:calc(92px + env(safe-area-inset-bottom,0px));padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));z-index:15}
.sugs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.sugs::-webkit-scrollbar{display:none}
.sugs button{flex:none;border:0;background:rgba(255,255,255,.85);border-radius:999px;padding:8px 13px;font-size:13.5px;box-shadow:var(--sh-float)}
.inputbox{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:6px 6px 6px 18px;box-shadow:0 10px 26px -16px rgba(60,66,120,.55)}
.inputbox input{flex:1;border:0;outline:0;font-size:16px;background:transparent;min-width:0;padding:8px 0}
.inputbox button{width:42px;height:42px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--ink-inverse);color:#fff;padding:0;flex:none}
.inputbox button svg{width:19px;height:19px}
.inputbox button:disabled{opacity:.4}
.inputbox .mic{background:var(--chip);color:var(--ink)}
.inputbox .mic.on{background:var(--red-strong);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,56,31,.45)}70%{box-shadow:0 0 0 12px rgba(201,56,31,0)}100%{box-shadow:0 0 0 0 rgba(201,56,31,0)}}
.places{margin-top:10px;display:flex;flex-direction:column;gap:8px;white-space:normal}
.place{display:flex;align-items:center;gap:10px;background:var(--sunken);border-radius:14px;padding:10px 12px}
.place .txt{flex:1;min-width:0}
.place .n{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.place .d{font-size:12.5px;color:var(--ink-muted)}
.place a{flex:none}
.iris{border-radius:50%;flex:none;background:#DDF3EF;object-fit:cover;display:block}
.botrow{display:flex;gap:8px;align-items:flex-end;max-width:94%}
.botrow .msg{max-width:none;flex:1;min-width:0}
.irisline{border:0;width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:12px 14px;margin-top:16px;font-size:15px;line-height:1.4;color:var(--ink)}
.irisline>span:not(.ico){flex:1;min-width:0}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-size:15px;text-align:left}
.opt[aria-pressed=true]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue-ink);font-weight:600}
.qr{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 0 42px}
.qr button{border:1.5px solid var(--blue);background:var(--surface);color:var(--blue-ink);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600;text-align:left}
.qr button.outra{border-style:dashed;color:var(--muted, #5b6170);font-weight:500}
/* vídeo de apresentação */
.planos{position:fixed;inset:0;z-index:55;background:var(--surface);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
.planos .ptop{display:flex;align-items:center;justify-content:space-between;max-width:440px;margin:0 auto}
.planos .pwrap{max-width:440px;margin:0 auto}
.planos .ptop svg{width:40px;height:40px}
.planos .ptop .round svg{width:21px;height:21px}
.planos h1{font-family:var(--f-ui);font-weight:800;font-size:30px;text-wrap:balance;line-height:1.08;letter-spacing:-.02em;text-align:center;color:var(--navy);margin:22px 0 16px}
.planos .pintro{display:flex;gap:10px;align-items:flex-start;background:var(--lav,#F1F0FF);border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.4;margin-bottom:16px}
.pcard{border:1.5px solid var(--line);border-radius:24px;padding:22px 22px 20px;margin-top:14px;background:var(--surface)}
.pcard.plus{border:2px solid var(--navy);box-shadow:0 18px 36px -24px rgba(12,42,72,.45)}
.pcard .pname{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-ui);font-weight:800;font-size:21px;color:var(--navy)}
.pcard .badge{font-family:var(--f-ui);font-size:12.5px;font-weight:600;color:#1A7F72;background:#DFF3F0;border-radius:999px;padding:6px 12px;white-space:nowrap}
.pcard .price{font-family:var(--f-ui);font-weight:800;font-size:44px;letter-spacing:-.03em;color:var(--navy);margin-top:12px;line-height:1}
.pcard .price small{font-family:var(--f-ui);font-weight:500;font-size:16px;color:var(--ink-muted);letter-spacing:0;margin-left:4px}
.pcard .old{font-size:15px;color:var(--ink-muted);text-decoration:line-through;margin-top:10px}
.pcard .psub{color:var(--ink-muted);font-size:15.5px;margin:10px 0 0;padding-bottom:16px;border-bottom:1px solid var(--line)}
.pcard ul{list-style:none;padding:0;margin:14px 0 18px;display:flex;flex-direction:column;gap:11px}
.pcard li{display:flex;gap:10px;align-items:flex-start;font-size:15.5px;line-height:1.35;color:var(--ink)}
.pcard li i{flex:none;width:22px;height:22px;border-radius:50%;background:#DFF3F0;color:#1A7F72;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700;margin-top:-1px}
.pcard .btn.soft{background:#DFF3F0;color:#1A7F72}
.planos .pnote{font-size:13px;color:var(--ink-muted);text-align:center;margin:16px 6px 0;line-height:1.45}
.coach{position:fixed;inset:0;z-index:60}
.coach .spot{position:fixed;border-radius:50%;pointer-events:none}
.coach .spot::after{content:'';position:absolute;inset:-7px;border-radius:50%;border:3px solid var(--teal);animation:coachPulse 1.4s ease-out infinite}
@keyframes coachPulse{0%{transform:scale(.92);opacity:1}100%{transform:scale(1.25);opacity:0}}
.coach .csvg{position:fixed;left:0;top:0;pointer-events:none;display:block}
.coach .bubble{position:fixed;background:var(--surface);border-radius:20px;padding:14px 16px;box-shadow:0 18px 40px -16px rgba(0,0,0,.55)}
.coach .ct{font-family:var(--f-display);font-weight:600;font-size:19px;color:var(--ink)}
.coach .cd{font-size:15px;line-height:1.4;color:var(--ink);margin-top:2px}
@media (prefers-reduced-motion:reduce){.coach .spot::after{animation:none}}
.ai-note{font-size:12.5px;color:var(--ink-muted);text-align:center;margin:6px 0 2px}

Sua tarefa: entender o pedido e devolver UM objeto JSON dizendo o que fazer. Entenda pedidos do jeito que as pessoas falam: g\xEDrias, abrevia\xE7\xF5es ("amanh\xE3 cedinho", "dps do almo\xE7o", "sexta q vem"), erros de digita\xE7\xE3o, v\xE1rios pedidos numa frase. N\xE3o invente hor\xE1rios que a pessoa n\xE3o disse: deixe "hora": null e o app encontra o melhor hor\xE1rio livre.
A cada pedido voc\xEA recebe o nome da pessoa, a data e a hora, a agenda dela, o que ela deixou de fazer e a conversa recente.

Regras:
- "planejar": colocar uma ou mais atividades na agenda. "itens" na ORDEM em que devem acontecer ("correr depois da academia" = academia primeiro, depois corrida). Se uma atividade j\xE1 est\xE1 na agenda desse dia, inclua-a com o MESMO t\xEDtulo da agenda e "hora": null, para servir de refer\xEAncia de ordem. Atividades em dias diferentes ("academia segunda e quarta \xE0s 7"): um item por dia, cada um com o seu "dia".
- Refer\xEAncias a algo que n\xE3o est\xE1 na agenda viram per\xEDodo: "depois do trabalho", "depois da aula", "quando eu sair", "fim do dia" = "noite"; "cedinho", "antes do trabalho", "de manh\xE3" = "manha"; "depois do almo\xE7o" = "tarde". Use tamb\xE9m o per\xEDodo quando o usu\xE1rio disser s\xF3 a parte do dia.
- "rotina": atividade que se repete TODA semana ("academia toda segunda, quarta e sexta \xE0s 7", "estudar todo dia \xE0s 20h", "correr de segunda a sexta de manh\xE3"). Um item em "itens" e os dias em "dias_semana". Para um plano semanal com atividades diferentes por dia (treino A/B/C, cronograma de estudo por mat\xE9ria), um item por atividade, cada um com o seu "dias_semana" e t\xEDtulo espec\xEDfico ("Treino: peito e tr\xEDceps", "Estudar: matem\xE1tica"); tudo vira um Confirmar s\xF3" (0 = domingo, 1 = segunda ... 6 = s\xE1bado; "todo dia" = [0,1,2,3,4,5,6]; "dia de semana" ou "de segunda a sexta" = [1,2,3,4,5]; "fim de semana" = [0,6]). Uma vez s\xF3 ("segunda que vem", "amanh\xE3") N\xC3O \xE9 rotina: \xE9 "planejar".
- ENTENDA A ROTINA DE VERDADE antes de criar (voc\xEA \xE9 a governanta: quer saber como \xE9 a vida da pessoa). Compromisso fixo com hora pra come\xE7ar e acabar (trabalho, est\xE1gio, aula, faculdade, escola, curso, plant\xE3o, turno) precisa de "hora" E "hora_fim" certos. Se a pessoa disse s\xF3 o per\xEDodo ("trabalho de segunda a sexta \xE0 tarde"), s\xF3 um hor\xE1rio ("entro \xE0s 8") ou n\xE3o disse os dias, use "perguntar" com UMA pergunta direta ("De que horas at\xE9 que horas voc\xEA trabalha?", "E sai que horas?", "Quais dias?") e 2 ou 3 "sugestoes" realistas para o per\xEDodo dito ("13h \xE0s 18h", "14h \xE0s 19h", "Varia cada dia"). N\xE3o chute hor\xE1rio de trabalho ou aula. Se os hor\xE1rios mudam por dia ("seg e qua at\xE9 18, sex at\xE9 14"), um item por grupo de dias, cada um com o seu "dias_semana", "hora" e "hora_fim". Se a pessoa disser que varia, pergunte dia a dia ou crie s\xF3 os dias que ela souber. Quando a resposta vier na mensagem seguinte ("das 13 \xE0s 18"), junte com o que ela disse antes (na conversa recente) e crie a rotina completa. Atividade solta (academia, corrida, estudar) pode ficar com "hora": null que o app acha um hor\xE1rio.
- Depois de criar uma rotina fixa (trabalho, aula), v\xE1 conhecendo a semana da pessoa, uma pergunta por vez: "E fora o trabalho, tem faculdade, academia ou algo fixo na semana?", "Quanto tempo leva pra chegar no trabalho?". Pare quando ela disser que \xE9 s\xF3 isso.
- "mudar" (com "alvo_id") muda dia ("novo_dia"), come\xE7o ("nova_hora") E/OU at\xE9 que horas vai ("nova_hora_fim"): "o casamento vai at\xE9 23h" = "mudar" s\xF3 com "nova_hora_fim": "23:00". Se um compromisso vai crescer e passar por cima de outro, fa\xE7a os dois na mesma resposta com "varios" (ex.: "cancelar" a academia daquela quinta pelo "alvo_id" da agenda + "mudar" o casamento). Use sempre o "alvo_id" exato da agenda (ids "r_..." s\xE3o uma vez de uma rotina: cancelar s\xF3 aquele dia).
- Abas: o app separa as atividades em "Pessoal" e "Trabalho" (a aba Trabalho junta TRABALHO E ESTUDOS: trabalho, est\xE1gio, reuni\xE3o, cliente, plant\xE3o, aula, escola, col\xE9gio, faculdade, cursinho, curso, reda\xE7\xE3o, estudar, prova, simulado). "categoria" de cada item segue isso; o resto (academia, corrida, m\xE9dico, mercado, refei\xE7\xF5es, lazer, fam\xEDlia, levar ou buscar algu\xE9m, mesmo que seja na faculdade ou na escola) \xE9 "pessoal". O app j\xE1 separa sozinho pelo nome, ent\xE3o voc\xEA NUNCA diz que n\xE3o consegue trocar de aba.
- "aba": a pessoa pede para trocar atividades de aba ("coloca tudo que for reda\xE7\xE3o, cursinho e aula no trabalho", "academia \xE9 pessoal", "a reuni\xE3o de pais \xE9 pessoal"): "aba_categoria" e "termos" = as palavras do nome das atividades, curtas ("reda\xE7\xE3o", "cursinho", "aula"). Vale para o que j\xE1 est\xE1 na agenda, para as rotinas e para tudo que vier com esse nome. A "fala" confirma no seu jeito; o app lista o que mudou e oferece Desfazer.
- "mudar_rotina": mudar uma rotina que J\xC1 EXISTE (est\xE1 na lista "Rotinas da pessoa"): dias ("na verdade \xE9 s\xF3 de segunda a sexta", "tira o s\xE1bado do trabalho"), hor\xE1rio ("o trabalho agora \xE9 das 9 \xE0s 18") ou nome. Use "rotina_id" e s\xF3 o que muda: "dias_semana" (a lista COMPLETA de dias que ficam), "nova_hora", "nova_hora_fim", "novo_titulo". Muda todas as pr\xF3ximas vezes. NUNCA crie uma "rotina" nova com o mesmo nome de uma que j\xE1 existe: isso duplica e d\xE1 conflito; use "mudar_rotina". "mudar" (com "alvo_id") \xE9 s\xF3 para mexer em UMA vez ("s\xF3 amanh\xE3 o trabalho come\xE7a \xE0s 10").
- ENTREVISTA DA ROTINA: quando vier o bloco "Entrevista da rotina", voc\xEA est\xE1 conhecendo a semana da pessoa, assunto por assunto (trabalho, estudos, exerc\xEDcio, outras coisas fixas), para montar a base fixa da agenda antes das coisas que variam. Leia a resposta pensando na pergunta feita. Se ela deu os dias e o hor\xE1rio de come\xE7o e fim: "rotina" (um item por grupo de dias com hor\xE1rio diferente; se falou de outros assuntos junto, crie todos). Se faltou algo (s\xF3 o per\xEDodo, s\xF3 a entrada, "depende"), "perguntar" s\xF3 o que falta, com "sugestoes". Se ela n\xE3o tem isso ("n\xE3o trabalho", "n\xE3o estudo"), confirmou que est\xE1 certo ("t\xE1 certo", "isso mesmo") ou quer pular: "entrevista_proximo" com uma "fala" curta e acolhedora. Se pediu para parar ou mudou de assunto de vez: "entrevista_parar" (e se ela pediu outra coisa, use "varios" com "entrevista_parar" e o pedido). Na entrevista, a "fala" da rotina N\xC3O faz a pr\xF3xima pergunta nem p\xF5e "sugestoes": o app pergunta o pr\xF3ximo assunto depois do Confirmar. "Cada dia \xE9 diferente": pergunte os hor\xE1rios de cada dia. "Quero come\xE7ar" (exerc\xEDcio): sugira dias e hor\xE1rio que caibam nos hor\xE1rios livres e pergunte se fecha.
- "apagar_rotina": tirar a rotina inteira ("n\xE3o fa\xE7o mais academia", "apaga a rotina do trabalho"), com "rotina_id". Para faltar um dia s\xF3, use "cancelar" com o "alvo_id" daquele dia.
- "financa": tudo sobre dinheiro, no campo "financa". "gasto": a pessoa gastou ("gastei 50 no mercado", "paguei 30 de uber", "ifood 42"). "entrada": recebeu um dinheiro avulso ("recebi 200 de um freela"). "conta": conta que se repete todo m\xEAs ("minha luz vence dia 10, uns 180", "aluguel 1500 todo dia 5"), com "descricao" = nome curto da conta ("Luz", "Aluguel") e "parcelas" se for parcelado ("geladeira em 10x de 300": valor 300, parcelas 10; sem dia dito, use "dia_vencimento": null, n\xE3o pergunte: o app p\xF5e a 1\xAA parcela no m\xEAs que vem, e a "fala" diz isso). "renda": sal\xE1rio ou renda fixa ("recebo 3 mil todo dia 5"). "pagar": pagou uma conta fixa que est\xE1 no caderno ("paguei a luz"), com "descricao" = o nome da conta como aparece no caderno. "limite": quanto quer gastar no m\xE1ximo no dia a dia no m\xEAs. "forma": como pagou, s\xF3 se a pessoa disser ("no cr\xE9dito", "no pix", "no d\xE9bito"); gasto no cr\xE9dito vai para a fatura do cart\xE3o e s\xF3 sai do saldo quando ela pagar a fatura. "fatura": pagou a fatura do cart\xE3o ("paguei a fatura", "paguei o cart\xE3o"), com "valor" se ela disser. "saldo": quanto tem na conta agora ("tenho 1200 na conta", "t\xF4 com 300 no banco", "t\xF4 zerada" = 0, "t\xF4 no vermelho 200" = -200). "corrigir": mudar algo j\xE1 anotado ("na verdade foram 60", "o uber foi 45", "era no cr\xE9dito", "muda a luz para 200"): "descricao" = qual (como est\xE1 no caderno; sem nome = o \xFAltimo anotado), e s\xF3 os campos que mudam ("valor", "categoria", "forma", "data", "novo_nome", "dia_vencimento"); "alvo": "conta_fixa" quando for conta ou renda fixa. "apagar": tirar algo anotado ("apaga o uber", "anotei errado, tira o \xFAltimo gasto", "cancelei a academia, tira das contas" = "alvo": "conta_fixa"). "consulta": quanto gastou num per\xEDodo e/ou categoria ("quanto gastei nesta semana?", "quanto foi de comida no m\xEAs passado?"), com "periodo" e "categoria". "disponivel": "quanto ainda posso gastar?", "d\xE1 pra gastar 200 no fim de semana?" (a "fala" responde com base no "Dispon\xEDvel de verdade" do caderno). "resumo": vis\xE3o geral do dinheiro ("como t\xE3o minhas contas?", "quanto sobra?", "quais contas faltam?"). V\xE1rios gastos numa frase ("gastei 30 no uber e 12 no caf\xE9"): "varios" com um "financa" por gasto. Boleto ou conta de UMA VEZ S\xD3 (n\xE3o repete todo m\xEAs): "conta" com "data" = dia do vencimento (AAAA-MM-DD, no m\xEAs certo) e "parcelas": 1; entra em Contas e o app avisa antes de vencer. Boleto ou conta para pagar NUNCA vira "lembrete": se faltar o valor, use "perguntar". "Me lembra de pagar X dia 9 de dezembro" sem valor: "lembrete" com o "dia" certo dentro do item. Valores em reais, como n\xFAmero. NUNCA invente valor, data ou gasto que a pessoa n\xE3o disse: se faltar o valor, use null (o app pergunta); se n\xE3o der para saber qual anota\xE7\xE3o mudar, use "perguntar". Use os n\xFAmeros do caderno, nunca chute. Na "fala" de "financa" pode dizer que anotou (entra direto, com Desfazer); se a pessoa est\xE1 perto de estourar ou estourou o limite, cobre no seu jeito, sem serm\xE3o. N\xC3O escreva valores em reais na "fala" (nem saldo, nem quanto resta, nem o valor anotado): o app calcula e mostra os n\xFAmeros certos logo depois. "disponivel" com um valor ("d\xE1 pra gastar 400?"): ponha o valor em "valor".
- "lembrete": lembrar de fazer algo ("lembre-me de pagar a luz amanh\xE3"). Um item com o t\xEDtulo come\xE7ando por verbo no infinitivo ("Pagar a conta de luz").
- "mudar": mexer num compromisso que J\xC1 EST\xC1 na agenda. Use "alvo_id" e "novo_dia", "nova_hora", "nova_hora_fim" e/ou "novo_titulo" (trocar o nome).
- CRIAR x AJUSTAR: "ajustar", "reajustar", "remarcar", "reagendar", "mudar", "trocar", "passar", "adiar", "antecipar", "empurrar", "jogar pra", "mover", "esticar", "encurtar", "corrigir", "arrumar" (e varia\xE7\xF5es: "reajusta", "remarquei", "passa pra") algo que j\xE1 est\xE1 na agenda = "mudar" com o "alvo_id" dele. NUNCA "planejar" nesse caso: "planejar" cria OUTRA atividade e a antiga continua l\xE1, duplicada. "Criar", "marcar", "colocar", "agendar", "adicionar", "quero fazer" algo novo = "planejar". Se a pessoa disser "outra", "mais uma", "tamb\xE9m" ("marca outra academia \xE0s 19h"), \xE9 criar. Se o nome bate com algo da agenda e n\xE3o d\xE1 para saber se \xE9 para mudar ou criar outro, use "perguntar" ("Mudo a academia das 7h ou crio outra?").
- "cancelar": remover um compromisso existente. Use "alvo_id".
- "livres": perguntar hor\xE1rios livres. "organizar": pedir para organizar ou ver o dia.
- "perto": procurar um lugar perto do usu\xE1rio ("padaria mais pr\xF3xima", "posto de gasolina perto de mim", "farm\xE1cia aqui perto"). Em "busca", "termo" = o lugar em portugu\xEAs e "osm" = 1 a 3 etiquetas do OpenStreetMap no formato chave=valor (padaria: shop=bakery; posto: amenity=fuel; farm\xE1cia: amenity=pharmacy; mercado: shop=supermarket; restaurante: amenity=restaurant; caf\xE9: amenity=cafe; academia: leisure=fitness_centre; banco: amenity=bank; caixa eletr\xF4nico: amenity=atm; hospital: amenity=hospital).
- "integracao": perguntas sobre o Google Agenda, Contatos ou Gmail no Faiz ("liguei o Google Agenda, foi?", "t\xE1 puxando minha agenda?", "como ligo o Gmail?"), com "servico". Responda em "resposta" usando a linha "Integra\xE7\xF5es com o Google" (\xE9 o estado real, voc\xEA enxerga sim): com o Google Agenda ligado, voc\xEA TRAZ os compromissos de l\xE1 para o Faiz e desvia deles ao montar o dia; o Faiz n\xE3o manda nada para o Google Agenda (as tarefas, avisos e cobran\xE7as ficam aqui no Faiz, que \xE9 o lugar delas). Se n\xE3o est\xE1 ligado, diga que d\xE1 para ligar em 1 minuto e que o bot\xE3o vem logo abaixo. O Calend\xE1rio do iPhone ainda n\xE3o d\xE1 para ler (s\xF3 o Google Agenda, por enquanto). Nunca mande a pessoa copiar compromissos na m\xE3o para nenhum lugar.

  - dinheiro: definir um limite, anotar as contas fixas, ver para onde o dinheiro est\xE1 indo.

/* ---------- Avisos no celular (Web Push) ---------- */
const Push = (() => {

  async function state() {
    if (IS_IOS && !STANDALONE) return 'install';
    if (!PUSH_OK) return 'unsupported';
    if (permission() === 'denied') return 'denied';

    if (!vapidKey) { try { vapidKey = (await Cloud.fn('config', {}, false)).vapidPublicKey || ''; } catch (e) {} }
    if (!vapidKey) throw new Error('sem chave');
    const sub = await subscribe(r);

    S.settings.notify.enabled = true; S.stats.reminders++; save();

      é passageiro, então tenta mais 2 vezes (1 s e 3 s depois), limpando uma inscrição pela metade. */
  async function subscribe(r) {
    let last;
    for (const espera of [0, 1000, 3000]) {
      if (espera) await new Promise((ok) => setTimeout(ok, espera));
      try {
        const sub = await r.pushManager.getSubscription();
        if (sub) return sub;
        return await r.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key(vapidKey) });
      } catch (e) {
        last = e;
        S.stats.pushSubRetry = (S.stats.pushSubRetry || 0) + 1;
        if (!/push service|AbortError|abort/i.test(String(e?.name) + ' ' + String(e?.message))) break;

  }
  return { state, enable, refresh, ready };
})();

async function googleVoltou(oa) {

    U.lastError = 'google: ' + oa.error;
    if (/already|exists|linked/i.test(oa.error + oa.code)) {
      // essa conta Google já é de outro Faiz: oferece entrar nela
      setTimeout(() => confirmSheet('Essa conta Google já tem um Faiz', 'Quer entrar nela? Os dados guardados nessa conta vão aparecer aqui no lugar dos deste celular.', 'Entrar nela', () => entrarGoogle('login')), 300);
    } else if (!/access_denied|cancel/i.test(oa.error)) setTimeout(() => toast('O login com Google não deu certo. Tente de novo em Mais.'), 300);
    return;

  const integ = oa.flow.startsWith('scopes:') ? oa.flow.slice(7) : '';
  if (integ) {
    S.account = { google: true, email: oa.email, em: S.account?.em || new Date().toISOString() };
    if (!oa.refresh) { save(); setTimeout(() => toast('O Google não liberou o acesso. Tente ligar de novo em Mais.'), 400); return; }

    integLigada(integ);
    return;

}

/* Caminho próprio das integrações (para a verificação do Google): o Google volta para a página do Faiz no domínio próprio
   (faizapp.com.br/google), que repassa o código para cá como ?gcode=&gstate=. O servidor troca o código pela chave. */
const GSTATE_KEY = 'faiz:gstate';
function googleIntegUrl(k, sc) {
  const st = Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, '0')).join('');
  try { localStorage.setItem(GSTATE_KEY, JSON.stringify({ st, k, em: Date.now() })); } catch (e) {}
  const q = new URLSearchParams({ client_id: U.gId, redirect_uri: U.gRedirect, response_type: 'code', scope: sc, access_type: 'offline', prompt: 'consent', include_granted_scopes: 'true', state: st });
  if (S.account?.email) q.set('login_hint', S.account.email);
  return 'https://accounts.google.com/o/oauth2/v2/auth?' + q;
}
async function googleCodigoVoltou() {
  const u = new URL(location.href), code = u.searchParams.get('gcode'), st = u.searchParams.get('gstate'), err = u.searchParams.get('gerror');
  if (!code && !err) return;
  ['gcode', 'gstate', 'gerror'].forEach((x) => u.searchParams.delete(x));
  try { history.replaceState(null, '', u.pathname + (u.search || '')); } catch (e) {}
  let salvo = null; try { salvo = JSON.parse(localStorage.getItem(GSTATE_KEY) || 'null'); localStorage.removeItem(GSTATE_KEY); } catch (e) {}
  if (err) { if (!/access_denied/.test(err)) setTimeout(() => toast('O Google não liberou o acesso. Tente ligar de novo em Mais.'), 400); return; }
  if (!salvo || salvo.st !== st || Date.now() - salvo.em > 30 * 60e3) { U.lastError = 'gstate'; setTimeout(() => toast('Esse pedido ao Google expirou. Tente ligar de novo em Mais.'), 400); return; }
  try { await Cloud.fn('gcode', { code }); }
  catch (e) { U.lastError = 'gcode: ' + (e?.code || e?.message || e); setTimeout(() => toast('Não consegui guardar o acesso ao Google. Tente de novo.'), 400); return; }
  integLigada(salvo.k);
}
async function googleContaVoltou(oa) {
  if (oa.flow === 'login' || oa.mudouDeConta) {
    // outro celular (ou depois de apagar): traz os dados da conta; se ela ainda não tem nada, fica com os deste celular
    const veio = await Cloud.pull(true);
    if (!veio) { S.onboarded = S.onboarded || false; }
  }
  S.account = { google: true, email: oa.email, em: S.account?.em || new Date().toISOString() };
  S.stats.google = (S.stats.google || 0) + 1;
  if (S.onb === 'conta') { S.onb = 'rotina'; onbRotina(); }
  save();
  setTimeout(() => toast(oa.flow === 'login' ? `Pronto! Entrei como ${oa.email} 💜` : `Conta salva com o Google (${oa.email}). Agora você não perde nada 💜`), 400);
}


/* ---------- Integrações com o Google: Agenda, Contatos e Gmail ----------
   O servidor só guarda a chave de renovação (tabela google_tokens) e entrega uma chave de 1 hora.
   Eventos, contatos e e-mails vão direto do Google para este celular; nada disso é guardado no servidor,
   a não ser o que a pessoa decide pôr na agenda ou nas contas. */
const GSCOPES = { agenda: 'https://www.googleapis.com/auth/calendar.events.readonly https://www.googleapis.com/auth/calendar.calendarlist.readonly', tarefas: 'https://www.googleapis.com/auth/tasks.readonly', contatos: 'https://www.googleapis.com/auth/contacts.readonly', gmail: 'https://www.googleapis.com/auth/gmail.readonly' };
const G = (() => {
  let tok = null, exp = 0;
  async function token() {
    if (tok && exp > Date.now() + 60000) return tok;
    const r = await Cloud.fn('gtoken');
    tok = r.access_token; exp = Date.now() + (r.expires_in || 3600) * 1000;
    return tok;
  }
  async function api(url, opt = {}) {
    let t;
    try { t = await token(); }
    catch (e) { if (e?.code === 'google_revoked' || e?.code === 'google_none') { S.integ = {}; save(); render(true); toast('O acesso ao Google foi desligado. Ligue de novo em Mais, se quiser.'); } throw e; }
    const r = await fetch(url, { ...opt, headers: { Authorization: 'Bearer ' + t, ...(opt.body ? { 'Content-Type': 'application/json' } : {}), ...(opt.headers || {}) } });
    if (r.status === 401) tok = null;
    if (!r.ok && r.status !== 404 && r.status !== 410) { const er = new Error('google ' + r.status); er.status = r.status; throw er; }
    return r.status === 204 || r.status === 404 || r.status === 410 ? null : r.json();
  }

})();
const integ = (k) => !!S.integ?.[k];

  sheet(`<div class="row" style="gap:10px">${irisImg('oculos', 44)}<div class="sub" style="flex:1"><b>Ligar ${esc(o[0])}</b><br>${esc(o[1])}</div></div>
    <div class="warn"><b>Vai aparecer um aviso do Google:</b> "O Google não verificou este app". É porque o Faiz ainda está em teste. Toque em <b>Avançado</b> › <b>Acessar Faiz</b> e depois em <b>Continuar</b>, marcando a permissão.</div>
    <div class="row"><button class="btn light" type="button" id="glNo" style="flex:1">Agora não</button><button class="btn" type="button" id="glYes" style="flex:2">Continuar</button></div>`, (el) => {

      if (U.gRedirect && U.gId) { S.stats.gCaminho = 'proprio'; save(); location.href = googleIntegUrl(k, sc); return; }
      try { await Cloud.google('scopes:' + k, sc); }
      catch (e) { U.lastError = 'google: ' + (e?.message || e); toast('Não consegui abrir o Google agora. Tente de novo.'); }

/* Google Agenda: só traz os compromissos (14 dias) para o Faiz. O Faiz NÃO escreve na agenda da pessoa (decisão do Tiago, 5/11). */
const isoLocal = (date, min) => `${date}T${String(Math.floor(min / 60)).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}:00`;
const sigOf = (t) => `${t.title}|${t.date}|${t.start ?? ''}|${t.end ?? ''}`;
var agendaBusy = false, agendaT = null; // var: o save() pode chamar antes desta linha rodar
/** Agendas do Google que a pessoa deixa visíveis (escola, trabalho, feriados...). Sem permissão para a lista: só a principal. */
async function gcalList() {
  try {
    const r = await G.api('https://www.googleapis.com/calendar/v3/users/me/calendarList?minAccessRole=reader&maxResults=100');
    const cals = (r?.items || []).filter((c) => c.selected !== false && !c.hidden && !c.deleted && !/#contacts@|#weeknum@/.test(c.id));
    S.integ.agendaSoPrincipal = false;
    return cals.length ? cals.map((c) => c.id) : ['primary'];
  } catch (e) {
    if (e?.status === 403) { S.integ.agendaSoPrincipal = true; return ['primary']; }
    throw e;
  }
}
/** Google Agenda → Faiz: traz 30 dias de todas as agendas visíveis. Eventos de vários dias aparecem em cada dia. Só leitura. */
const GDIAS = 30;
async function agendaSync(force) {
  if (!integ('agenda') || !Cloud.on || agendaBusy || ehGratis()) return;
  if (!force && U.agendaAt && Date.now() - U.agendaAt < 5 * 60000) return agendaLimpa();
  agendaBusy = true;
  try {
    const d0 = today(), d1 = L.addDays(d0, GDIAS);
    const cals = await gcalList();
    const antigos = new Map(S.tasks.filter((t) => t.source === 'google').map((t) => [t.id, t]));
    const novos = new Map();
    const poe = (id, date, start, end, ev) => {
      if (date < d0 || date >= d1 || novos.has(id)) return;
      const old = antigos.get(id);
      const t = { id, title: String(ev.summary || '(sem título)').slice(0, 80), date, start, end, category: 'pessoal', color: 'blue', status: old?.status || 'pendente', tag: 'Google Agenda', source: 'google', createdAt: old?.createdAt || Date.now() };
      t.gsig = sigOf(t);
      novos.set(id, t);
    };
    for (const cal of cals) {
      let page = '', n = 0;
      do {
        const q = new URLSearchParams({ timeMin: new Date(L.parseKey(d0)).toISOString(), timeMax: new Date(L.parseKey(d1)).toISOString(), singleEvents: 'true', orderBy: 'startTime', maxResults: '250', ...(page ? { pageToken: page } : {}) });
        const r = await G.api(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cal)}/events?${q}`);
        for (const ev of r?.items || []) {
          if (ev.status === 'cancelled' || ev.extendedProperties?.private?.faizId) continue;
          if ((ev.attendees || []).some((a) => a.self && a.responseStatus === 'declined')) continue; // convite recusado
          const id = 'g_' + ev.id;
          if (ev.start?.dateTime) {
            const s0 = new Date(ev.start.dateTime), e0 = new Date(ev.end?.dateTime || ev.start.dateTime);
            const ds = L.dateKey(s0), de = L.dateKey(new Date(e0.getTime() - 1));
            if (ds === de || e0 <= s0) poe(id, ds, L.minutesOf(s0), Math.max(L.minutesOf(s0) + 15, Math.min(24 * 60 - 1, L.minutesOf(e0) || 24 * 60 - 1)), ev);
            else { // passa da meia-noite: um pedaço em cada dia
              poe(id, ds, L.minutesOf(s0), 24 * 60 - 1, ev);
              for (let d = L.addDays(ds, 1), i = 0; d < de && i < GDIAS; d = L.addDays(d, 1), i++) poe(`${id}~${d}`, d, undefined, undefined, ev);
              poe(`${id}~${de}`, de, 0, Math.max(15, L.minutesOf(e0)), ev);
            }
          } else if (ev.start?.date) { // dia inteiro (fim é exclusivo)
            const fim = ev.end?.date && ev.end.date > ev.start.date ? ev.end.date : L.addDays(ev.start.date, 1);
            for (let d = ev.start.date, i = 0; d < fim && i < GDIAS + 1; d = L.addDays(d, 1), i++) poe(d === ev.start.date ? id : `${id}~${d}`, d, undefined, undefined, ev);
          }
        }
        page = r?.nextPageToken || ''; n++;
      } while (page && n < 8);
    }
    S.tasks = S.tasks.filter((t) => !(t.source === 'google' && t.date >= d0)).concat([...novos.values()]);
    U.agendaAt = Date.now();
    S.stats.agendaSync = (S.stats.agendaSync || 0) + 1; S.stats.gcals = cals.length; S.stats.gEventos = novos.size; delete S.stats.agendaErr;
    save(); render(true);
  } catch (e) { U.lastError = 'agenda: ' + (e?.message || e); S.stats.agendaErr = String(e?.status || 'falha'); }
  finally { agendaBusy = false; }
  return agendaLimpa();
}

/** Google Tarefas → Faiz: tarefas com data (de 7 dias atrás até 60 à frente), de todas as listas. Só leitura.
 *  Concluída no Google = feita aqui. Tarefa sem data fica de fora (o Faiz organiza por dia). */
let tarefasBusy = false;
async function tarefasSync(force) {
  if (!integ('tarefas') || !Cloud.on || tarefasBusy || ehGratis()) return;
  if (!force && U.tarefasAt && Date.now() - U.tarefasAt < 5 * 60000) return;
  tarefasBusy = true;
  try {
    const d0 = L.addDays(today(), -7), d1 = L.addDays(today(), 60);
    const listas = (await G.api('https://tasks.googleapis.com/tasks/v1/users/@me/lists?maxResults=100'))?.items || [];
    const antigos = new Map(S.tasks.filter((t) => t.source === 'gtasks').map((t) => [t.id, t]));
    const novos = [];
    let semData = 0;
    for (const l of listas) {
      let page = '', n = 0;
      do {
        const q = new URLSearchParams({ showCompleted: 'true', showHidden: 'false', maxResults: '100', dueMin: new Date(L.parseKey(d0)).toISOString(), dueMax: new Date(L.parseKey(L.addDays(d1, 1))).toISOString(), ...(page ? { pageToken: page } : {}) });
        const r = await G.api(`https://tasks.googleapis.com/tasks/v1/lists/${encodeURIComponent(l.id)}/tasks?${q}`);
        for (const x of r?.items || []) {
          if (x.deleted || !x.title?.trim()) continue;
          if (!x.due) { semData++; continue; }
          const date = String(x.due).slice(0, 10); // o Google guarda só o dia (hora 00:00 UTC)
          if (date < d0 || date > d1) continue;
          const id = 'gt_' + x.id, old = antigos.get(id);
          novos.push({ id, title: String(x.title).trim().slice(0, 80), date, category: 'pessoal', color: 'lilac', tag: 'Google Tarefas', source: 'gtasks',
            status: x.status === 'completed' ? 'feito' : old?.status === 'feito' ? 'feito' : 'pendente', createdAt: old?.createdAt || Date.now() });
        }
        page = r?.nextPageToken || ''; n++;
      } while (page && n < 5);
    }
    S.tasks = S.tasks.filter((t) => t.source !== 'gtasks').concat(novos);
    U.tarefasAt = Date.now();
    S.stats.tarefasSync = (S.stats.tarefasSync || 0) + 1; S.stats.gTarefas = novos.length; S.stats.gTarefasSemData = semData; S.stats.gListas = listas.length; delete S.stats.tarefasErr;
    save(); render(true);
  } catch (e) { U.lastError = 'tarefas: ' + (e?.message || e); S.stats.tarefasErr = String(e?.status || 'falha'); }
  finally { tarefasBusy = false; }
}

/** Até 5/11 o Faiz copiava as tarefas para o Google Agenda. Agora não copia mais: apaga as cópias que tinha feito (uma vez). */
async function agendaLimpa() {
  const map = S.gmap || {};
  if (!integ('agenda') || agendaBusy || !Object.keys(map).length) { if (S.integ?.agendaEscrever) { delete S.integ.agendaEscrever; save(); } return; }
  agendaBusy = true;
  try {
    const base = 'https://www.googleapis.com/calendar/v3/calendars/primary/events', resto = { ...map };
    for (const [tid, m] of Object.entries(map)) {
      try { await G.api(`${base}/${encodeURIComponent(m.gid)}`, { method: 'DELETE' }); delete resto[tid]; }
      catch (e) { if (e?.status === 404 || e?.status === 410) delete resto[tid]; else if (e?.status === 403) { delete resto[tid]; } else throw e; }
    }
    S.gmap = resto; delete S.integ.agendaEscrever; S.stats.agendaLimpa = (S.stats.agendaLimpa || 0) + 1; save();
  } catch (e) { U.lastError = 'agenda (limpar): ' + (e?.message || e); }
  finally { agendaBusy = false; }
}

/* Contatos: "jantar com a Ana" → convite pronto no WhatsApp. */
let contatosCache = null;

  const r = await G.api('https://people.googleapis.com/v1/people/me/connections?personFields=names,phoneNumbers&pageSize=1000&sortOrder=FIRST_NAME_ASCENDING');
  const list = (r?.connections || []).map((p) => ({ nome: p.names?.[0]?.displayName || '', primeiro: L.norm(p.names?.[0]?.givenName || p.names?.[0]?.displayName || '').split(' ')[0], fone: (p.phoneNumbers?.[0]?.canonicalForm || p.phoneNumbers?.[0]?.value || '').replace(/\D/g, '') })).filter((c) => c.nome && c.fone);

/* Gmail: procura só contas e boletos e sugere anotar. Nada do e-mail fica guardado. */
const b64u = (s) => { try { return decodeURIComponent(escape(atob(String(s).replace(/-/g, '+').replace(/_/g, '/')))); } catch (e) { return ''; } };
function textoDoEmail(p) {
  if (!p) return '';
  if (p.mimeType === 'text/plain' && p.body?.data) return b64u(p.body.data);
  if (p.parts) { const t = p.parts.map(textoDoEmail).filter(Boolean); if (t.length) return t.join('\n'); }
  if (p.mimeType === 'text/html' && p.body?.data) return b64u(p.body.data).replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ');
  return '';
}
/** Valor, vencimento e nome de quem cobra, a partir do texto (função pura, testada). */
function lerBoleto(txt, de, hoje) {
  const t = String(txt).replace(/\s+/g, ' ');
  const vals = [...t.matchAll(/(total|valor|pagar|fatura|cobrança)?[^R]{0,40}R\$\s?(\d{1,3}(?:\.\d{3})*,\d{2})/gi)];
  const v = (vals.find((m) => m[1]) || vals[0]);
  const vc = /venc\w*[^0-9]{0,40}(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/i.exec(t);
  if (!v || !vc) return null;
  const valor = L.parseValor(v[2]);
  const ano = vc[3] ? (vc[3].length === 2 ? 2000 + +vc[3] : +vc[3]) : +hoje.slice(0, 4);
  const due = `${ano}-${String(+vc[2]).padStart(2, '0')}-${String(+vc[1]).padStart(2, '0')}`;
  if (!valor || !/^\d{4}-\d{2}-\d{2}$/.test(due) || L.diffDays(hoje, due) < -5 || L.diffDays(hoje, due) > 45) return null;
  const nome = L.cap(String(de || '').replace(/<.*>/, '').replace(/["']/g, '').replace(/\b(no-?reply|nao-?responda|faturas?|cobran[cç]a)\b/gi, '').trim().slice(0, 30)) || 'Conta';
  return { nome, valor, due };
}

    const r = await G.api(`https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=15&q=${encodeURIComponent(q)}`);
    const vistos = new Set(S.gmailSeen || []), achados = [];

      const msg = await G.api(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${m.id}?format=full`);

/** O que a Íris diz no topo da tela Hoje. */
function irisHoje() {
  const d = today(), st = L.dayStats(S.tasks, d), pend = st.pendente + st.andamento;
  const late = S.tasks.filter((t) => t.date < d && t.status !== 'feito' && L.diffDays(t.date, d) <= 7).length;
  if (late) return { mood: 'cobrando', text: `${late === 1 ? '1 coisa atrasada' : `${late} coisas atrasadas`}? Bora resolver isso hoje, sem enrolação 😤` };
  if (st.total && !pend) return { mood: 'comemorando', text: 'Arrasou! Tudo feito hoje 🎉' };
  const best = L.bestStreak(S.tasks, d);
  if (pend && best && best.n >= 3) return { mood: 'comemorando', text: `🔥 ${best.n} seguidas de ${L.lc(best.title)}! Não vai quebrar hoje, hein.` };
  if (pend) return { mood: 'principal', text: `Hoje tem ${plural(pend, 'coisa', 'coisas')}. Levanta que o dia não espera!` };
  return { mood: 'neutra', text: 'Dia livre! Me conta o que você precisa que eu organizo.' };
}

/** Horário em que o Faiz vai avisar desta tarefa (ou null). */

  if (!t || t.start == null || t.status === 'feito') return null;

/* ---------- Utilidades ---------- */
let toastT;
function toast(text, action) {
  const t = document.getElementById('toast');
  t.innerHTML = `<span style="flex:1">${esc(text)}</span>${action ? `<button type="button" id="toastAct">${esc(action.label)}</button>` : ''}`;
  t.classList.add('show');
  if (action) document.getElementById('toastAct').onclick = () => { action.run(); t.classList.remove('show'); };
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3500);
}
function sheet(html, onMount) {

const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;
/* ---------- Tarefas ---------- */
/** Aplica na agenda. Tirar uma vez de uma rotina marca o dia como pulado (senão a rotina recria); desfazer tira a marca. */
function applyOps(ops) {
  for (const o of ops) {
    const t = o.type === 'remove' ? S.tasks.find((x) => x.id === o.id) : o.type === 'restore' ? o.task : null;
    const r = t?.routine && (S.routines || []).find((x) => x.id === t.routine);
    if (!r) continue;
    if (o.type === 'remove' && !(r.skip || []).includes(t.date)) r.skip = [...(r.skip || []), t.date].slice(-60);
    if (o.type === 'restore') r.skip = (r.skip || []).filter((d) => d !== t.date);
  }
  const r = L.applyOps(S.tasks, ops); S.tasks = r.tasks; save(); return r.undo;
}
function toggleTask(id) {
  const t = S.tasks.find((x) => x.id === id); if (!t) return;
  const next = t.status === 'feito' ? 'pendente' : 'feito';
  const undo = applyOps([{ type: 'setStatus', id, status: next }]);
  if (next === 'feito') { S.stats.tasksDone++; const k = L.doneStreak(S.tasks, t.title, t.date); toast(`"${t.title}" concluída${k >= 2 ? ` · 🔥 ${k} seguidas!` : ''}`, { label: 'Desfazer', run: () => { applyOps(undo); render(true); } }); }
  render(true);
}
function removeTask(id) {
  const t = S.tasks.find((x) => x.id === id); if (!t) return;
  if (t.source === 'google') { toast('Esse compromisso é do seu Google Agenda: apague por lá que ele some daqui.'); return; }
  if (t.source === 'gtasks') { toast('Essa tarefa é do seu Google Tarefas: apague ou conclua por lá que eu atualizo aqui.'); return; }
  const undo = applyOps([{ type: 'remove', id }]);
  toast(`"${t.title}" excluída`, { label: 'Desfazer', run: () => { applyOps(undo); render(true); } });
  render(true);
}

/** Cria uma rotina (e as próximas vezes na agenda). Devolve a rotina. */
function addRoutine(spec, since = today()) {
  const r = { id: L.newId('r'), title: spec.title, dias: spec.dias, start: spec.start, end: spec.end, category: spec.category || 'pessoal', color: spec.color || 'green', since, createdAt: Date.now() };
  S.routines = [...(S.routines || []), r];
  S.tasks = L.materialize(S.tasks, [r], today()).tasks;
  S.stats.routines = (S.stats.routines || 0) + 1;
  save();
  return r;
}
function deleteRoutine(id) {
  const r = L.removeRoutine(S.tasks, S.routines, id, today());
  S.tasks = r.tasks; S.routines = r.routines; save();
}
const streakMemo = new Map();
/** Vezes seguidas (para o selo 🔥 dos cartões). */
function streakOf(title) {
  const k = L.norm(title);
  if (!streakMemo.has(k)) streakMemo.set(k, L.doneStreak(S.tasks, title, today()));
  return streakMemo.get(k);
}

/* ---------- Contas (caderno da casa) ---------- */
function applyFin(ops) { const r = L.applyFin(S.fin, ops); S.fin = r.fin; S.stats.fin = (S.stats.fin || 0) + 1; save(); return r.undo; }
const undoFin = (undo) => { S.fin = L.applyFin(S.fin, undo).fin; save(); render(true); };
const catOf = (k) => L.CATS.find((c) => c.k === k) || L.CATS[L.CATS.length - 1];
const brl = (c, short) => L.fmtBRL(c, short);
const reais = (c) => (c / 100).toFixed(2).replace('.', ',');
const monthsBetween = (a, b) => { const [y1, m1] = a.split('-').map(Number), [y2, m2] = b.split('-').map(Number); return (y2 * 12 + m2) - (y1 * 12 + m1); };
/** "vence dia 20", "vence amanhã", "atrasada há 3 dias", "paga em 18/11". */
function billWhen(b) {
  const renda = b.fixa.tipo === 'renda';
  if (b.pago) return `${renda ? 'recebido' : 'paga'} em ${L.ddmm(b.pago.data)}`;
  if (b.status === 'atrasada') return b.dias === -1 ? (renda ? 'era ontem' : 'venceu ontem') : `${renda ? 'era' : 'atrasada'} há ${-b.dias} dias`;
  if (b.status === 'hoje') return renda ? 'cai hoje' : 'vence hoje';
  if (b.status === 'breve') return `${renda ? 'cai' : 'vence'} ${b.dias === 1 ? 'amanhã' : `em ${b.dias} dias`}`;
  return `${renda ? 'cai' : 'vence'} dia ${Number(b.due.slice(8))}`;
}
/** O que a Íris diz sobre o mês. */
function finIris(s) {
  if (s.contas.atrasadas) return { mood: 'cobrando', text: `${s.contas.atrasadas === 1 ? 'Tem 1 conta atrasada' : `Tem ${s.contas.atrasadas} contas atrasadas`}! Paga logo, antes dos juros 😤` };
  if (s.restante != null && s.restante < 0) return { mood: 'cobrando', text: `Estourou o limite em ${brl(-s.restante, true)}. Segura a onda no resto do mês 😬` };
  if (s.limite && s.restante < s.limite * 0.2) return { mood: 'surpresa', text: `Eita, só restam ${brl(s.restante, true)} do seu limite. Vai com calma!` };
  if (s.entra && s.sobra < 0) return { mood: 'cansada', text: `Do jeito que tá, vai faltar ${brl(-s.sobra, true)} no fim do mês. Bora cortar alguma coisa?` };
  if (s.contas.total && !s.contas.abertas) return { mood: 'comemorando', text: 'Todas as contas do mês pagas. Orgulho! 🎉' };
  return { mood: 'principal', text: 'Me fala seus gastos que eu anoto, tipo “gastei 30 no uber” ou “paguei a luz”.' };
}

const LPER = [['semana', 'Semana'], ['mes', 'Mês'], ['mes_passado', 'Mês passado'], ['30dias', '30 dias'], ['ano', 'Ano']];
const chips = (act, cur, opts) => `<div class="fchips" role="group">${opts.map(([k, l]) => `<button type="button" aria-pressed="${cur === k}" data-act="${act}" data-v="${k}">${l}</button>`).join('')}</div>`;

function finLanc() {
  const td = today(), F = S.fin, per = U.lper || 'mes', tp = U.ltipo || 'tudo', p = L.periodo(per, td);

/* gráficos em SVG, sem biblioteca */
const kbrl = (c) => { const r = c / 100; return r >= 1000 ? `${(r / 1000).toFixed(r >= 10000 ? 0 : 1).replace('.', ',')} mil` : `${Math.round(r)}`; };
function lineChart(pts, limite, m) {
  const W = 320, H = 170, x0 = 34, x1 = W - 12, y0 = 18, y1 = H - 26;
  const days = L.daysInMonth(m), max = Math.max(1, ...pts.map((p) => p.total), limite || 0) * 1.12;
  const X = (d) => x0 + ((d - 1) / Math.max(1, days - 1)) * (x1 - x0), Y = (v) => y1 - (v / max) * (y1 - y0);
  const grid = [0.5, 1].map((f) => { const v = (max / 1.12) * f; return `<line x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${x0 - 6}" y="${Y(v) + 4}" class="ax" text-anchor="end">${kbrl(v)}</text>`; }).join('');
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.dia).toFixed(1)},${Y(p.total).toFixed(1)}`).join('');
  const last = pts[pts.length - 1];
  const xl = [1, 10, 20, days].map((d) => `<text x="${X(d)}" y="${H - 8}" class="ax" text-anchor="middle">${d}</text>`).join('');
  return `<div class="readout" id="lnRead">${last ? `Até o dia ${last.dia}: <b>${brl(last.total, true)}</b>` : 'Sem gastos ainda.'}</div>
    <svg class="lnchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gastos acumulados no mês" data-pts='${JSON.stringify(pts.map((p) => [p.dia, p.total]))}' data-g='${JSON.stringify({ x0, x1, y0, y1, days, max })}'>
      <line x1="${x0}" x2="${x1}" y1="${y1}" y2="${y1}" class="base"/>${grid}${xl}
      ${limite ? `<line x1="${x0}" x2="${x1}" y1="${Y(limite)}" y2="${Y(limite)}" class="lim"/><text x="${x1}" y="${Y(limite) - 5}" class="ax" text-anchor="end">limite ${kbrl(limite)}</text>` : ''}
      ${pts.length ? `<path d="${path}" fill="none" stroke="${COR_LINHA}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle class="dot" cx="${X(last.dia)}" cy="${Y(last.total)}" r="4.5" fill="${COR_LINHA}" stroke="#fff" stroke-width="2"/>` : ''}
      <rect x="${x0}" y="0" width="${x1 - x0}" height="${H}" fill="transparent" class="hit"/>
    </svg>`;
}
function barsChart(ms) {
  const W = 320, H = 170, x0 = 34, x1 = W - 8, y0 = 14, y1 = H - 26, max = Math.max(1, ...ms.flatMap((m) => [m.entradas, m.saidas])) * 1.1;
  const gw = (x1 - x0) / ms.length, bw = Math.min(16, gw / 2 - 4), Y = (v) => y1 - (v / max) * (y1 - y0);
  const sel = U.gsel != null && U.gsel < ms.length ? U.gsel : ms.length - 1;
  const bar = (x, v, c) => { const h = Math.max(v ? 2 : 0, y1 - Y(v)); if (!h) return ''; const r = Math.min(4, h); return `<path d="M${x},${y1}V${y1 - h + r}Q${x},${y1 - h} ${x + r},${y1 - h}H${x + bw - r}Q${x + bw},${y1 - h} ${x + bw},${y1 - h + r}V${y1}Z" fill="${c}"/>`; };
  const grid = [0.5, 1].map((f) => { const v = (max / 1.1) * f; return `<line x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${x0 - 6}" y="${Y(v) + 4}" class="ax" text-anchor="end">${kbrl(v)}</text>`; }).join('');
  const cur = ms[sel];
  return `<div class="legend"><span><i style="background:${COR_ENTRA}"></i>Entradas</span><span><i style="background:${COR_SAI}"></i>Saídas</span></div>
    <div class="readout">${L.MONTHS[Number(cur.mes.slice(5)) - 1]}: entrou <b>${brl(cur.entradas, true)}</b> e saiu <b>${brl(cur.saidas, true)}</b></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e saídas por mês">
      <line x1="${x0}" x2="${x1}" y1="${y1}" y2="${y1}" class="base"/>${grid}
      ${ms.map((m, i) => { const gx = x0 + i * gw, cx = gx + gw / 2; return `<g>${i === sel ? `<rect x="${gx + 2}" y="${y0 - 6}" width="${gw - 4}" height="${y1 - y0 + 6}" rx="8" class="selbg"/>` : ''}${bar(cx - bw - 1, m.entradas, COR_ENTRA)}${bar(cx + 1, m.saidas, COR_SAI)}<text x="${cx}" y="${H - 8}" class="ax${i === sel ? ' on' : ''}" text-anchor="middle">${L.MONTHS[Number(m.mes.slice(5)) - 1].slice(0, 3)}</text><rect x="${gx}" y="0" width="${gw}" height="${H}" fill="transparent" data-act="gbar" data-v="${i}" style="cursor:pointer"><title>${L.MONTHS[Number(m.mes.slice(5)) - 1]}: entrou ${brl(m.entradas, true)}, saiu ${brl(m.saidas, true)}</title></rect></g>`; }).join('')}
    </svg>`;
}

function finGraf() {
  const td = today(), F = S.fin, per = U.gper || 'mes', p = L.periodo(per, td), r = L.periodSummary(F, p.de, p.ate);

  const sem = L.periodSummary(F, L.periodo('semana', td).de, td), semP = L.periodo('semana_passada', td), semAnt = L.periodSummary(F, semP.de, semP.ate);
  const tot = r.porCat.reduce((a, c) => a + c.valor, 0) || 1, maxC = r.porCat[0]?.valor || 1;

    <div class="sumrow"><div><span>Entrou</span><b class="num" style="color:var(--green-ink)">${brl(r.entradas, true)}</b></div><div><span>Saiu</span><b class="num">${brl(r.saidas, true)}</b></div><div><span>Diferença</span><b class="num">${r.entradas - r.saidas < 0 ? '−' : ''}${brl(Math.abs(r.entradas - r.saidas), true)}</b></div></div>

    <div class="label">Evolução dos gastos em ${esc(L.MONTHS[Number(mm.slice(5)) - 1].toLowerCase())}</div>

      <div class="meta" style="margin-top:4px">${semAnt.saidas ? `${dif > 0 ? `${brl(dif, true)} a mais` : dif < 0 ? `${brl(-dif, true)} a menos` : 'O mesmo'} que na semana passada (${brl(semAnt.saidas, true)}).` : 'Semana passada não teve gasto anotado.'}</div></div>
    <details class="card tabela"><summary>Ver os números em tabela</summary>
      <table><thead><tr><th>Mês</th><th>Entradas</th><th>Saídas</th></tr></thead><tbody>${ms.map((m) => `<tr><td>${L.MONTHS[Number(m.mes.slice(5)) - 1]}</td><td>${brl(m.entradas, true)}</td><td>${brl(m.saidas, true)}</td></tr>`).join('')}</tbody></table>
      ${r.porCat.length ? `<table><thead><tr><th>Categoria (${esc(p.nome)})</th><th>Valor</th><th>%</th></tr></thead><tbody>${r.porCat.map((c) => `<tr><td>${esc(catOf(c.cat).nome)}</td><td>${brl(c.valor, true)}</td><td>${Math.round((c.valor / tot) * 100)}%</td></tr>`).join('')}</tbody></table>` : ''}
    </details>`;
}
/* toque/arraste no gráfico de linha: mostra o valor do dia */
document.addEventListener('pointermove', lineHover);
document.addEventListener('pointerdown', lineHover);
function lineHover(e) {
  const svg = e.target.closest?.('svg.lnchart'); if (!svg) return;
  const pts = JSON.parse(svg.dataset.pts || '[]'), g = JSON.parse(svg.dataset.g || '{}'); if (!pts.length) return;
  const rc = svg.getBoundingClientRect(), x = ((e.clientX - rc.left) / rc.width) * 320;
  const d = Math.round(1 + ((x - g.x0) / (g.x1 - g.x0)) * (g.days - 1));
  const p = pts.reduce((a, b) => (Math.abs(b[0] - d) < Math.abs(a[0] - d) ? b : a));
  const cx = g.x0 + ((p[0] - 1) / Math.max(1, g.days - 1)) * (g.x1 - g.x0), cy = g.y1 - (p[1] / g.max) * (g.y1 - g.y0);
  const dot = svg.querySelector('.dot'); if (dot) { dot.setAttribute('cx', cx); dot.setAttribute('cy', cy); }
  let cross = svg.querySelector('.cross'); if (!cross) { cross = document.createElementNS('http://www.w3.org/2000/svg', 'line'); cross.setAttribute('class', 'cross'); svg.insertBefore(cross, svg.firstChild); }
  cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('y1', g.y0); cross.setAttribute('y2', g.y1);
  const rd = document.getElementById('lnRead'); if (rd) rd.innerHTML = `Até o dia ${p[0]}: <b>${brl(p[1], true)}</b>`;
}

const valorZero = (s) => /^\s*(r\$\s*)?0+([.,]0+)?\s*$/i.test(String(s || ''));
/** Gasto ou entrada: anotar ou editar. */
function movSheet(tipo = 'saida', id) {
  const old = id && S.fin.mov.find((x) => x.id === id);

const newId = () => L.newId('m');
function push(m) { S.chat.push({ id: newId(), createdAt: Date.now(), ...m }); save(); }
/** Tira o primeiro objeto JSON do texto do modelo. */
function parseJson(text) {
  const t = String(text || '');
  try { return JSON.parse(t); } catch (e) {}
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) return JSON.parse(t.slice(a, b + 1));
  throw new Error('sem JSON');
}
/** Qual Íris responde: a completa (Sonnet) monta planos, conversa e segue uma pergunta que ela mesma fez;
    a rápida (Haiku) cuida do dia a dia (marcar, mudar, cancelar, lembrete, gasto). No teste de 10/11, as duas
    resolveram 20 de 20 pedidos do mesmo jeito; a completa só vai mais além nas sugestões. */
const COMPLETA = /rotina|todo dia|todos os dias|toda (seg|ter|qua|qui|sex|sab|dom)|semana|cronograma|treino|dieta|plano|organiz|monta|planej|ajuda|conselho|dica|como (eu )?(faco|posso|consigo|fazer)|o que (eu )?(faco|fazer)|cansad|triste|ansios|desanim|estress|sozinh|nao consigo|\?/;
function nivelIA(texto) {
  if (S.entrevista?.on) return 'completa';
  const t = L.norm(texto);
  if (t.length > 140 || COMPLETA.test(t)) return 'completa';
  const ult = [...S.chat].reverse().find((m) => m.who === 'bot');
  if (ult && /\?\s*$/.test(ult.text || '') && Date.now() - (ult.createdAt || 0) < 30 * 60000) return 'completa'; // respondendo a uma pergunta da Íris
  return 'rapida';
}

    try { S.stats.kinds = { ...(S.stats.kinds || {}), aba: ((S.stats.kinds || {}).aba || 0) + 1 }; } catch {}
    push({ who: 'bot', mood: 'comemorando', text: a.text, links: [{ label: `Ver aba ${a.c === 'trabalho' ? 'Trabalho' : 'Pessoal'}`, act: 'verAba', v: a.c }], undo: { cats: a.undo, done: false } });
    if (opt.voice || S.settings.speak) Voice.speak(a.text.split('\n')[0]);
    U.scrollChat = true; render(true); return;
  }
  U.typing = true; U.scrollChat = true; render(true);
  const etapaAntes = S.entrevista?.etapa;
  const ctx = { now: new Date(), tasks: S.tasks, fin: S.fin, integ: S.integ || {}, routines: S.routines, entrevista: entrevistaCtx(), recentUser: S.chat.filter((m) => m.who === 'me').slice(-4).map((m) => m.text).join(' ') };

    try {

      const parts = L.buildPromptParts(clean, ctx, recent, { nome: (S.name || '').split(' ')[0] });
      // Íris rápida (Haiku, ~16x mais barata) nos pedidos simples; a completa (Sonnet) para planos, conversa e perguntas

        catch (e) { if (e?.code === 'free_limit') e.limite = 5; e.why = e?.code ? 'servidor_' + e.code : !navigator.onLine ? 'sem_internet' : e?.status ? 'servidor_http' + e.status : 'rede'; throw e; }

        const definitivo = ['servidor_no_credit', 'servidor_trial_over', 'servidor_limit', 'servidor_free_limit', 'servidor_free_plan', 'servidor_auth', 'sem_internet', 'cortada'].includes(e?.why);
        if (definitivo) throw e;

        json = await tentar();

    } catch (e) {

/** O que a pessoa fez pelos botões do aviso (Feito / Adiar) sem abrir o app: o servidor guardou, o app aplica aqui. */
var acoesBusy = false; // var: a abertura (async) pode chamar antes desta linha
async function acoesDoAviso() {
  if (!Cloud.on || !S.onboarded || acoesBusy) return;

  try {
    const r = await Cloud.fn('acoes');
    const xs = Array.isArray(r?.acoes) ? r.acoes : [];

      if (a.action === 'feito' && t.status !== 'feito') { applyOps([{ type: 'setStatus', id: t.id, status: 'feito' }]); S.stats.tasksDone++; msgs.push(`${t.title} feita ✅`); }
      else if (a.action === 'adiar' && Number.isFinite(a.start) && (t.start !== a.start || t.date !== a.date)) { applyOps([{ type: 'move', id: t.id, date: a.date || t.date, start: a.start, end: Number.isFinite(a.end) ? a.end : undefined }]); S.stats.snoozed++; msgs.push(`${t.title} foi para ${L.fmtTime(a.start)}`); }
    }
    S.stats.pushActs = (S.stats.pushActs || 0) + xs.length; save(); render(true);

  } catch (e) { U.lastError = 'acoes: ' + (e?.code || e?.message); }

}

/* ---------- Voz: falar com o Faiz e ouvir a resposta ---------- */
const Voice = (() => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, heard = '';
  const clean = (t) => String(t || '').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, '').replace(/\s+/g, ' ').trim();
  // Voz da Íris (Thalita). O iPhone só toca áudio "destravado" por um toque: unlock() roda no toque do microfone/enviar.
  const player = new Audio(); player.preload = 'auto'; window.__irisAudio = player;
  let unlocked = false, falaN = 0;
  function unlock() {
    if (unlocked) return;
    unlocked = true;
    try { player.src = 'silencio.mp3'; const p = player.play(); if (p) p.then(() => player.pause()).catch(() => { unlocked = false; }); } catch (e) { unlocked = false; }
  }
  function stopAll() { try { speechSynthesis?.cancel(); } catch (e) {} try { player.pause(); } catch (e) {} }
  async function speak(text) {
    const t = clean(text); if (!t) return;
    const n = ++falaN;
    stopAll();
    if (Cloud.on && U.ttsOk === true && !ehGratis()) {
      try {
        const blob = await Cloud.audio(t.slice(0, 700));
        if (n !== falaN) return; // chegou outra fala depois
        if (player.dataset.url) URL.revokeObjectURL(player.dataset.url);
        player.dataset.url = player.src = URL.createObjectURL(blob);
        await player.play();
        S.stats.vozIris = (S.stats.vozIris || 0) + 1;
        return;
      } catch (e) { U.lastError = 'voz da Íris: ' + (e?.message || e); if (n !== falaN) return; }
    }
    robot(t);
  }
  function robot(t) {
    if (!('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(t.slice(0, 600));
      u.lang = 'pt-BR'; u.rate = 1.05;
      const v = speechSynthesis.getVoices().find((x) => /pt[-_]BR/i.test(x.lang));
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function stop() { try { rec?.stop(); } catch (e) {} }
  function start() {
    unlock();
    if (U.listening) { stop(); return; }
    stopAll();
    if (!SR) {
      const inp = document.getElementById('chatInput');
      inp?.focus();
      toast('Toque no microfone do teclado para ditar a mensagem.');
      return;
    }
    heard = '';
    rec = new SR();
    rec.lang = 'pt-BR'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
    rec.onresult = (e) => {
      heard = Array.from(e.results).map((r) => r[0].transcript).join(' ');
      const inp = document.getElementById('chatInput'); if (inp) inp.value = heard;
    };
    rec.onerror = (e) => {
      U.listening = false; render(true);
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') toast(IS_IOS ? 'Libere o microfone em Ajustes › Faiz (ou Safari) › Microfone. Ou use o microfone do teclado.' : 'Libere o microfone para o Faiz nas permissões do navegador.');
      else if (e.error === 'no-speech') toast('Não ouvi nada. Toque no microfone e fale de novo.');
      else if (e.error !== 'aborted') toast('O microfone não funcionou agora. Use o microfone do teclado.');
    };
    rec.onend = () => {
      U.listening = false;
      const t = heard.trim(); heard = '';
      const inp = document.getElementById('chatInput'); if (inp) inp.value = '';
      render(true);
      if (t) send(t, { voice: true });
    };
    try { rec.start(); U.listening = true; S.stats.voice = (S.stats.voice || 0) + 1; render(true); }
    catch (e) { U.listening = false; toast('O microfone não funcionou agora. Use o microfone do teclado.'); }
  }
  return { start, stop, speak, unlock, supported: !!SR };
})();

/* ---------- Lugares perto ---------- */
const fmtDist = (m) => (m < 1000 ? `${Math.max(10, Math.round(m / 10) * 10)} m` : `${(m / 1000).toFixed(1).replace('.', ',')} km`);
function routeUrl(p) {
  return IS_IOS
    ? `https://maps.apple.com/?daddr=${p.lat},${p.lon}&q=${encodeURIComponent(p.nome)}`
    : `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}`;
}
function getPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject({ code: 'unsupported' });
    navigator.geolocation.getCurrentPosition((p) => resolve(p.coords), (e) => reject({ code: e.code === 1 ? 'denied' : 'unavailable' }), { enableHighAccuracy: false, timeout: 12000, maximumAge: 300000 });
  });
}
async function findNearby(nb, voice) {
  U.typing = true; render(true);
  let msg;
  try {
    const c = await getPosition();
    const { places } = await Cloud.fn('nearby', { lat: c.latitude, lon: c.longitude, termo: nb.termo, osm: nb.osm });
    msg = places?.length
      ? { who: 'bot', mood: 'oculos', text: places.length === 1 ? `Achei 1 ${nb.termo} perto de você:` : `Achei ${places.length} opções de ${nb.termo} perto de você. A mais próxima fica a ${fmtDist(places[0].dist)}:`, places }
      : { who: 'bot', mood: 'cansada', text: `Não achei ${nb.termo} num raio de 8 km de você. Quer que eu procure outra coisa?` };
    S.stats.nearby = (S.stats.nearby || 0) + 1;
  } catch (e) {
    msg = { who: 'bot', mood: 'cansada', text: e?.code === 'denied'
      ? `Preciso da sua localização para achar ${nb.termo} perto de você. ${IS_IOS ? 'Libere em Ajustes › Privacidade › Serviços de Localização › Safari (Sites) e tente de novo.' : 'Libere a localização para este site e tente de novo.'}`
      : e?.code === 'unavailable' || e?.code === 'unsupported' ? 'Não consegui pegar sua localização agora. Confira se o GPS está ligado e tente de novo.'
      : 'Não consegui buscar os lugares agora. Tente de novo em instantes.' };
  }
  U.typing = false;
  push(msg);
  if (voice || S.settings.speak) Voice.speak(msg.places?.length ? `${msg.text.split(':')[0]}. ${msg.places[0].nome}.` : msg.text);
  U.scrollChat = true; render(true);
}

async function assinarPlus() {

/** Pix de 1 mês: mostra o QR code e o copia-e-cola e fica conferindo até o Pix cair (o código vale 30 minutos). */
let pixT = null;
async function pixPlus() {

  }
  if (r?.ja) { if (r.plano) U.plano = r.plano; render(true); return toast('Seu Plus já está pago ✅'); }
  if (!r?.codigo) return toast('Não consegui gerar o Pix agora. Tente de novo daqui a pouco.');

    <p class="meta" style="margin:0;text-align:center">No celular: copie o código e cole no app do seu banco, em Pix › Copia e cola.</p>
    <textarea id="pixCod" readonly rows="3" style="width:100%;font-size:12px;border-radius:12px;padding:10px;border:1px solid var(--line, #ddd);resize:none">${esc(r.codigo)}</textarea>
    <button class="btn" type="button" data-copy>Copiar código Pix</button>
    <p id="pixCopiado" role="status" aria-live="polite" hidden style="margin:0;text-align:center;font-weight:700;color:var(--navy)"></p>
    <p class="meta" id="pixSt" style="margin:0;text-align:center" role="status">Esperando o pagamento... assim que cair, eu libero sozinha.</p>
    <button class="btn soft" type="button" data-close-sheet>Fechar</button>`, (s2) => {
    s2.querySelector('[data-close-sheet]').onclick = () => { clearTimeout(pixT); closeSheet(); };
    // um toque: copia e avisa ali mesmo, no botão e na linha de baixo (o toast ficava escondido atrás da folha)
    s2.querySelector('[data-copy]').onclick = async (ev) => {
      const bt = ev.currentTarget, ta = s2.querySelector('#pixCod');
      let ok = false;
      try { await navigator.clipboard.writeText(ta.value); ok = true; } catch (e) {}
      if (!ok) { try { ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length); ok = document.execCommand('copy'); } catch (e) {} }
      const aviso = s2.querySelector('#pixCopiado');
      if (ok) {
        S.stats.pixCopiou = (S.stats.pixCopiou || 0) + 1; save();
        bt.textContent = '✓ Código Pix copiado!';
        aviso.textContent = 'Copiado! Agora abra o app do seu banco e cole em Pix › Copia e cola.';
        clearTimeout(bt._t); bt._t = setTimeout(() => { if (bt.isConnected) bt.textContent = 'Copiar de novo'; }, 4000);
      } else aviso.textContent = 'Não consegui copiar sozinha. Segure o dedo no código acima e toque em Copiar.';
      aviso.hidden = false;
    };
  });
  const fim = Math.min(Date.parse(r.expira) || Infinity, Date.now() + 30 * 60e3);
  clearTimeout(pixT);
  const confere = async () => {
    if (!document.getElementById('pixCod')) return; // a folha foi fechada
    try {
      const st = await Cloud.fn('pixstatus', { id });
      if (st?.plano) U.plano = st.plano;

        S.stats.pixPagou = new Date().toISOString(); save(); closeSheet(); render(true);
        return sheet(`<div class="row" style="gap:10px">${irisImg('comemorando', 56)}<div class="sub" style="flex:1"><b>Pix recebido! 🎉</b></div></div>

    } catch (e) {}
    if (Date.now() > fim) { const el = document.getElementById('pixSt'); if (el) el.textContent = 'O código venceu (vale 30 minutos). Feche e gere outro.'; return; }

}
