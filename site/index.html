/* ---------- Mini tutorial (setas e círculos) ----------
   Abre sozinho na primeira vez que a pessoa chega no Hoje; fica em Mais › "Ver o tutorial de novo".
   Um círculo dá foco em cada parte do app, uma seta aponta para ela e a Íris explica numa frase. */
const TUTORIAL = [
  { sel: '.nav [data-v=hoje]', t: 'Hoje', d: 'Seu dia num olhar: o que tem pra fazer hoje e quanto já foi feito.', mood: 'principal' },
  { sel: '.nav [data-v=agenda]', t: 'Agenda', d: 'Sua semana, hora por hora. Toque numa atividade pra mudar o nome ou o horário.', mood: 'oculos' },
  { sel: '.nav .center', t: 'Íris', d: 'Sou eu! Fala ou escreve do seu jeito, tipo "academia amanhã às 7", que eu coloco na agenda e te lembro.', mood: 'comemorando' },
  { sel: '.nav [data-v=tarefas]', t: 'Tarefas', d: 'Tudo o que falta fazer e suas rotinas. No + você cria uma tarefa na mão.', mood: 'principal' },
  { sel: '.nav [data-v=contas]', t: 'Contas', d: 'Seu caderno de dinheiro: gastos, contas fixas e quanto sobra no mês.', mood: 'oculos' },
  { sel: '.rate', t: 'Avaliar', d: 'Aqui você me dá nota e opinião. Vai direto pro time do Faiz 💜', mood: 'comemorando' },
  { sel: '.avatar', t: 'Mais', d: 'Avisos, sua conta e preferências ficam aqui.', mood: 'principal' },
];
let coachTry = 0;
/** Chamado a cada render: na primeira vez na tela principal, agenda o tutorial (uma vez só). */
function coachWatch() {
  if (S.tutorialSeen || U.coachPending || !S.onboarded || document.getElementById('coach') || /[?&](t|v)=/.test(location.search)) return;
  // os planos vêm antes do tutorial: espera o servidor dizer o plano (no máximo 6 s) e a tela de planos fechar
  if (Cloud.on && !U.meFeito) { if (!U.meEspera) U.meEspera = setTimeout(() => { U.meFeito = true; render(true); }, 6000); return; }
  if (U.planosAberto || U.pagando || planosModo()) return;
  U.coachPending = true; coachTry = 0;
  setTimeout(() => startCoach(false), 900);
}
function startCoach(manual) {
  if (document.getElementById('coach')) { U.coachPending = false; return; }
  // espera a tela principal e nenhuma folha aberta (ex.: o teste de aviso logo depois de permitir)
  if (!S.onboarded || !document.querySelector('.nav') || $overlay.innerHTML) {
    if (coachTry++ < 40) setTimeout(() => startCoach(manual), 1500); else U.coachPending = false;
    return;
  }
  U.coachPending = false; coachTry = 0;
  if (U.tab !== 'hoje') { U.tab = 'hoje'; render(); }
  window.scrollTo(0, 0);
  const el = document.createElement('div');
  el.className = 'coach'; el.id = 'coach'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Tutorial do Faiz');
  document.body.appendChild(el);
  let i = 0;
  const fim = (pulou) => {
    el.remove(); window.removeEventListener('resize', draw);
    S.tutorialSeen = true; S.tourSeen = true;
    S.stats.tutorial = { ...(S.stats.tutorial || {}), [pulou ? 'pulou' : 'viu']: ((S.stats.tutorial || {})[pulou ? 'pulou' : 'viu'] || 0) + 1, ...(pulou ? { parouEm: i + 1 } : {}) };
    save(); persistLocal(); render(true);
    if (!manual) setTimeout(surveyNudge, 600);
  };
  function draw() {
    const st = TUTORIAL[i], alvo = document.querySelector(st.sel);
    if (!alvo) { if (i < TUTORIAL.length - 1) { i++; return draw(); } return fim(false); }
    const r = alvo.getBoundingClientRect(), W = window.innerWidth, H = window.innerHeight;
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2, rad = Math.max(r.width, r.height) / 2 + 12;
    const embaixo = cy > H / 2; // alvo na metade de baixo: balão em cima
    const bw = Math.min(340, W - 32), bx = Math.min(Math.max(16, cx - bw / 2), W - 16 - bw);
    const gap = 74; // espaço para a seta
    const ultimo = i === TUTORIAL.length - 1;
    el.innerHTML = `<svg class="csvg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="width:${W}px;height:${H}px" aria-hidden="true"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#fff"/></marker></defs>
        <path d="M0,0H${W}V${H}H0Z M${cx - rad},${cy} a${rad},${rad} 0 1,0 ${rad * 2},0 a${rad},${rad} 0 1,0 ${-rad * 2},0Z" fill="rgba(12,20,48,.74)" fill-rule="evenodd"/>
        <path id="arPath" d="" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#ah)"/></svg>
      <div class="spot" style="left:${cx - rad}px;top:${cy - rad}px;width:${rad * 2}px;height:${rad * 2}px"></div>
      <div class="bubble" style="left:${bx}px;width:${bw}px;${embaixo ? `bottom:${H - (cy - rad) + gap}px` : `top:${cy + rad + gap}px`}">
        <div class="row" style="gap:10px;align-items:flex-start">${irisImg(st.mood, 44)}<div style="flex:1"><div class="ct">${esc(st.t)}</div><div class="cd">${esc(st.d)}</div></div></div>
        <div class="row" style="justify-content:space-between;align-items:center;margin-top:12px"><span class="meta">${i + 1} de ${TUTORIAL.length}</span>
          <span class="row" style="gap:8px">${ultimo ? '' : '<button class="pill" type="button" data-co="pular">Pular</button>'}<button class="pill navy" type="button" data-co="prox">${ultimo ? 'Bora começar!' : 'Próximo'}</button></span></div>
      </div>`;
    // a seta sai do balão e aponta para o círculo
    const bub = el.querySelector('.bubble').getBoundingClientRect();
    const sx = Math.min(Math.max(cx, bub.left + 30), bub.right - 30), sy = embaixo ? bub.bottom + 6 : bub.top - 6;
    const ex = cx, ey = embaixo ? cy - rad - 8 : cy + rad + 8;
    const mx = (sx + ex) / 2 + (sx > ex ? 30 : -30), my = (sy + ey) / 2;
    el.querySelector('#arPath').setAttribute('d', `M${sx},${sy} Q${mx},${my} ${ex},${ey}`);
    el.querySelector('[data-co=prox]')?.focus();
  }
  el.addEventListener('click', (e) => {
    const b = e.target.closest('[data-co]');
    if (b?.dataset.co === 'pular') return fim(true);
    // "Próximo" ou um toque em qualquer lugar: segue
    if (i >= TUTORIAL.length - 1) return fim(false);
    i++; draw();
  });
  window.addEventListener('resize', draw);
  draw();
}
function showTour() { S.tutorialSeen = false; startCoach(true); }

/* ---------- Pesquisa do teste (dia 3 e dia 7) ----------
   Perguntas usadas por empresas de produto: esforço (CES), teste de Sean Ellis (PMF), NPS,
   principal benefício e "como melhorar" (método da Superhuman) e disposição a pagar. */
const PESQUISA = {
  d3: { titulo: 'Como tá sendo comigo até agora?', mood: 'pensando', perguntas: [
    { k: 'facil', t: 'De 1 a 5, quão fácil está sendo organizar sua rotina comigo?', tipo: 'escala', de: 1, ate: 5, rotulos: ['Muito difícil', 'Muito fácil'] },
    { k: 'entendeu', t: 'Eu entendi o que você pediu?', tipo: 'opcao', ops: ['Quase sempre', 'Na maioria das vezes', 'Às vezes', 'Quase nunca'] },
    { k: 'avisos', t: 'Meus avisos te ajudaram a fazer as coisas?', tipo: 'opcao', ops: ['Sim, muito', 'Um pouco', 'Não ajudaram', 'Não recebi avisos'] },
    { k: 'irritou', t: 'O que mais te irritou ou fez falta até agora?', tipo: 'texto', opcional: true },
  ] },
  d7: { titulo: 'Fechamos a semana! Me dá sua nota final?', mood: 'comemorando', perguntas: [
    { k: 'ellis', t: 'Como você se sentiria se não pudesse mais usar o Faiz?', tipo: 'opcao', ops: ['Muito decepcionado', 'Um pouco decepcionado', 'Não ficaria decepcionado'] },
    { k: 'nps', t: 'De 0 a 10, quanto você recomendaria o Faiz para um amigo?', tipo: 'escala', de: 0, ate: 10, rotulos: ['Nada', 'Com certeza'] },
    { k: 'beneficio', t: 'Qual foi o principal benefício que o Faiz te deu?', tipo: 'texto', opcional: true },
    { k: 'melhorar', t: 'Como a gente pode melhorar o Faiz pra você?', tipo: 'texto', opcional: true },
    { k: 'iris', t: 'E o meu jeito (direta, que cobra)?', tipo: 'opcao', ops: ['Adorei', 'Tá bom assim', 'Exagerado, me incomodou'] },
    { k: 'queria', t: 'Qual destas você mais queria no Faiz?', tipo: 'opcao', opcional: true, ops: ['Entrar com Google (não perder meus dados)', 'Ligar com o Google Agenda', 'Widget na tela do celular', 'Contas mais completas (banco e cartão)', 'Lembretes pelo WhatsApp'] },
    { k: 'preco', t: 'Quanto você pagaria por mês por um Faiz completo?', tipo: 'opcao', ops: ['Nada, só usaria grátis', 'Até R$ 10', 'R$ 10 a R$ 20', 'R$ 20 a R$ 40', 'Mais de R$ 40'] },
  ] },
};
/** Qual pesquisa está pendente hoje ('d3', 'd7' ou null). */
function pesquisaDevida() {
  if (!S.startDate) return null;
  const dias = L.diffDays(S.startDate, today());
  if (dias >= 6 && !S.survey?.d7) return 'd7';
  if (dias >= 2 && dias < 6 && !S.survey?.d3) return 'd3';
  return null;
}
/** Dia do lembrete: a pessoa já passou do dia da pesquisa e não respondeu. */
function pesquisaAtrasada() {
  const q = pesquisaDevida(); if (!q) return null;
  const dias = L.diffDays(S.startDate, today());
  return (q === 'd3' && dias >= 3) || (q === 'd7' && dias >= 7) ? q : null;
}
/** Lembrete dentro do app, uma vez por pesquisa, ao abrir no dia seguinte. */
function surveyNudge() {
  const q = pesquisaAtrasada(); if (!q || S.surveyNudge?.[q]) return;
  S.surveyNudge = { ...(S.surveyNudge || {}), [q]: today() }; save();
  sheet(`<div class="row" style="gap:10px">${irisImg('pensando', 56)}<div class="sub" style="flex:1"><b>Ainda dá tempo! 🙏</b></div></div>
    <p style="margin:0">Sua opinião é <b>muito importante</b> pro grupo Faiz entender o que já tá bom e o que dá pra melhorar. ${q === 'd7' ? 'São 2 minutinhos.' : 'São só 4 perguntas rápidas.'}</p>
    <div class="row"><button class="btn light" type="button" data-sn="depois" style="flex:1">Depois</button><button class="btn" type="button" data-sn="ok" style="flex:2">Responder agora</button></div>`, (el) => {
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-sn]'); if (!b) return;
      closeSheet();
      if (b.dataset.sn === 'ok') setTimeout(() => surveySheet(q), 250);
    });
  });
}
function surveySheet(qual) {
  const P = PESQUISA[qual]; if (!P) return;
  const resp = {};
  const q = (p, i) => {
    let campo = '';
    if (p.tipo === 'escala') {
      const ns = []; for (let n = p.de; n <= p.ate; n++) ns.push(n);
      campo = `<div class="seg" style="flex-wrap:${ns.length > 6 ? 'wrap' : 'nowrap'}">${ns.map((n) => `<button type="button" aria-pressed="false" data-q="${p.k}" data-v="${n}" style="${ns.length > 6 ? 'flex:1 0 15%' : ''}">${n}</button>`).join('')}</div><div class="row" style="justify-content:space-between"><span class="meta">${esc(p.rotulos[0])}</span><span class="meta">${esc(p.rotulos[1])}</span></div>`;
    } else if (p.tipo === 'opcao') {
      campo = `<div style="display:flex;flex-direction:column;gap:6px">${p.ops.map((o) => `<button type="button" class="opt" aria-pressed="false" data-q="${p.k}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
    } else {
      campo = `<textarea class="field" data-qt="${p.k}" maxlength="800" style="height:80px" placeholder="Se quiser, escreva aqui"></textarea>`;
    }
    return `<div class="flabel" style="gap:8px"><span style="color:var(--ink);font-size:15px">${i + 1}. ${esc(p.t)}${p.opcional ? ' <span class="meta">(opcional)</span>' : ''}</span>${campo}</div>`;
  };
  sheet(`<div class="row" style="gap:10px">${irisImg(P.mood, 48)}<div class="sub" style="flex:1"><b>${esc(P.titulo)}</b><br>Leva ${qual === 'd7' ? '2 minutos' : '1 minuto'} e me ajuda a ficar melhor pra você.</div></div>
    ${P.perguntas.map(q).join('')}
    <p class="err" id="qErr" hidden>Responda as perguntas que não são opcionais.</p>
    <div class="row"><button class="btn light" type="button" data-qa="depois" style="flex:1">Depois</button><button class="btn" type="button" data-qa="enviar" style="flex:2">Enviar</button></div>`, (el) => {
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-q]');
      if (b) { resp[b.dataset.q] = b.dataset.v; el.querySelectorAll(`[data-q="${b.dataset.q}"]`).forEach((x) => x.setAttribute('aria-pressed', String(x === b))); el.querySelector('#qErr').hidden = true; return; }
      const a = e.target.closest('[data-qa]'); if (!a) return;
      if (a.dataset.qa === 'depois') { closeSheet(); toast('Tá bom, te lembro depois 😉'); return; }
      el.querySelectorAll('[data-qt]').forEach((t) => { if (t.value.trim()) resp[t.dataset.qt] = t.value.trim().slice(0, 800); });
      const faltam = P.perguntas.filter((p) => !p.opcional && resp[p.k] == null);
      if (faltam.length) { el.querySelector('#qErr').hidden = false; return; }
      if (resp.nps != null) resp.nps = Number(resp.nps);
      if (resp.facil != null) resp.facil = Number(resp.facil);
      S.survey = { ...(S.survey || {}), [qual]: { ...resp, em: new Date().toISOString() } };
      save(); closeSheet(); render(true);
      toast(qual === 'd7' ? 'Valeu demais! Isso muda o Faiz de verdade 💜' : 'Valeu! Já anotei tudo 😉');
    });
  });
}

/** Vezes seguidas (antes de hoje) que a pessoa furou esta atividade — igual ao servidor. */
/** Cartões: "Amanhã" ou "Sáb, 7/11" (curto para caber numa linha). */
function diaCurto(k) {
  const d = L.diffDays(today(), k);
  if (d === 0) return 'Hoje';
  if (d === 1) return 'Amanhã';
  const x = L.parseKey(k);
  return `${L.WEEKDAYS_SHORT[x.getDay()]}, ${x.getDate()}/${x.getMonth() + 1}`;
}
function missedCount(t) {
  if (t.source === 'google') return 0; // compromisso do Google Agenda não conta furo
  const n = L.norm(t.title).trim(), byDay = new Map(), from = L.addDays(t.date, -30);
  for (const o of S.tasks) if (o.source !== 'google' && o.date < t.date && o.date >= from && L.norm(o.title).trim() === n) byDay.set(o.date, (byDay.get(o.date) || false) || o.status === 'feito');
  let k = 0;
  for (const d of [...byDay.keys()].sort().reverse()) { if (byDay.get(d)) break; k++; }
  return k;
}

function nav() {
  const b = (k, ic, l) => `<button type="button" data-act="tab" data-v="${k}" ${U.tab === k ? 'aria-current="page"' : ''}>${I[ic]}<span>${l}</span></button>`;
  return `<nav class="nav" aria-label="Navegação">${b('hoje', 'home', 'Hoje')}${b('agenda', 'cal', 'Agenda')}<button type="button" class="center" data-act="tab" data-v="faz" aria-label="Falar com a Íris" ${U.tab === 'faz' ? 'aria-current="page"' : ''}><span class="ring">${LOGO}</span></button>${b('tarefas', 'tasks', 'Tarefas')}${b('contas', 'wallet', 'Contas')}</nav>`;
}

function render(keep) {
  streakMemo.clear();
  const y = window.scrollY;
  const draft = document.getElementById('chatInput')?.value;
  const tlY = document.getElementById('tlWrap')?.scrollTop;
  const pre = U.showInstall || (IS_IOS && !STANDALONE && !S.skipInstall && !S.onboarded) ? 'install'
    : !S.onboarded ? 'welcome'
    : S.onb === 'conta' ? 'onbConta'
    : S.onb ? ''
    : (!S.permAsked && canNotifyHere() && permission() === 'default') ? 'permit' : '';
  if (pre) { document.body.classList.remove('onb'); $app.innerHTML = screens[pre](); return; }
  if (S.onb) U.tab = 'faz';
  document.body.classList.toggle('onb', !!S.onb);
  $app.innerHTML = screens[U.tab]() + (S.onb ? '' : nav());
  coachWatch();
  planosWatch();
  if (U.tab === 'faz') {
    const inp = document.getElementById('chatInput');
    if (draft) inp.value = draft;
    document.getElementById('chatForm')?.addEventListener('submit', (e) => { e.preventDefault(); if (S.settings.speak) Voice.unlock(); const v = inp.value; inp.value = ''; send(v); });
    if (U.scrollChat) { U.scrollChat = false; requestAnimationFrame(() => window.scrollTo(0, document.body.scrollHeight)); }
    else if (keep) window.scrollTo(0, y);
  } else if (keep) window.scrollTo(0, y);
  const ff = U.tab === 'contas' && document.getElementById('finForm');
  if (ff) {
    const inp = document.getElementById('chatInput');
    if (draft) inp.value = draft;
    ff.addEventListener('submit', (e) => { e.preventDefault(); if (S.settings.speak) Voice.unlock(); const v = inp.value; inp.value = ''; send(v); });
  }
  if (U.tab === 'agenda') {
    const w = document.getElementById('tlWrap');
    if (keep && tlY != null) w.scrollTop = tlY;
    else { const sel = U.agenda, ev = S.tasks.filter((t) => t.date === sel && t.start != null).sort((a, b) => a.start - b.start)[0]; const target = sel === today() ? L.minutesOf(new Date()) - 90 : (ev?.start ?? 540) - 30; w.scrollTop = Math.max(0, (target / 60 - 6) * 64); }
  }
  const ne = U.tab === 'mais' && document.getElementById('nameEdit');
  if (ne) {
    ne.addEventListener('change', () => { S.name = ne.value.trim(); save(); toast('Nome salvo'); });
  }
}

/** Editar uma rotina (ou uma rotina ainda não confirmada): nome, dias, começo e fim. */
function routineSheet(r, onSave) {
  let dias = [...(r.dias || [])];
  const hm = (m) => (m == null ? '' : `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`);
  const ord = [1, 2, 3, 4, 5, 6, 0];
  sheet(`<h3>Editar rotina</h3>
    <label class="flabel" for="rtTitle">Nome<input class="field" id="rtTitle" maxlength="60" value="${esc(r.title)}"></label>
    <div class="flabel">Dias da semana<div class="wd7" id="rtDias">${ord.map((i) => `<button type="button" aria-pressed="${dias.includes(i)}" data-v="${i}" aria-label="${L.WEEKDAYS[i]}">${['D', 'S', 'T', 'Q', 'Q', 'S', 'S'][i]}</button>`).join('')}</div></div>
    <div class="row" style="gap:10px"><label class="flabel" for="rtIni" style="flex:1">Começa<input class="field" id="rtIni" type="time" value="${hm(r.start)}"></label><label class="flabel" for="rtFim" style="flex:1">Termina<input class="field" id="rtFim" type="time" value="${hm(r.end)}"></label></div>
    <p class="err" id="rtErr" hidden></p>
    <div class="row"><button class="btn light" type="button" id="rtCancel" style="flex:1">Cancelar</button><button class="btn" type="button" id="rtSave" style="flex:2">Salvar</button></div>`, (el) => {
    el.querySelector('#rtDias').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; const d = +b.dataset.v; dias = dias.includes(d) ? dias.filter((x) => x !== d) : [...dias, d]; b.setAttribute('aria-pressed', String(dias.includes(d))); });
    el.querySelector('#rtCancel').onclick = closeSheet;
    el.querySelector('#rtSave').onclick = () => {
      const err = (t) => { const er = el.querySelector('#rtErr'); er.hidden = false; er.textContent = t; };
      const title = el.querySelector('#rtTitle').value.trim();
      const tm = (id) => { const v = el.querySelector(id).value; return v ? +v.split(':')[0] * 60 + +v.split(':')[1] : undefined; };
      const start = tm('#rtIni'); let end = tm('#rtFim');
      if (!title) return err('Escreva o nome da rotina.');
      if (!dias.length) return err('Escolha pelo menos um dia.');
      if (start != null && end != null && end <= start) return err('O fim tem que ser depois do começo.');
      if (start != null && end == null) end = start + (r.start != null && r.end != null ? r.end - r.start : 60);
      closeSheet();
      onSave({ title: L.cap(title), dias: dias.slice().sort(), start, end });
    };
  });
}
/** Plano de rotinas ainda não confirmado: escolher qual editar (ou direto, se for uma só). */
function propEditSheet(m) {
  const rs = m.proposal.routines || [];
  const editar = (i) => routineSheet(rs[i], (spec) => {
    rs[i] = { ...rs[i], ...spec };
    const linha = (r) => `• ${r.title}: ${L.diasLabel(r.dias).toLowerCase()}${r.start != null ? ` às ${L.fmtTime(r.start)}${r.end != null ? `–${L.fmtTime(r.end)}` : ''}` : ''}`;
    const fala = (m.text || '').split('\n').filter((l) => !/^• |^Vou criar/.test(l));
    m.text = [...fala, rs.length > 1 ? `Vou criar ${rs.length} rotinas:` : 'Vou criar a rotina:', ...rs.map(linha)].join('\n');
    save(); render(true); toast('Plano atualizado. Confere e confirma 😉');
  });
  if (rs.length === 1) return editar(0);
  sheet(`<h3>Qual você quer editar?</h3><div class="card" style="padding:4px 0">${rs.map((r, i) => `<button class="setrow" type="button" data-i="${i}"><div class="txt"><div class="t">${esc(r.title)}</div><div class="meta">${esc(L.diasLabel(r.dias))}${r.start != null ? ' · ' + L.fmtTime(r.start) : ''}</div></div><span class="pill">✏️</span></button>`).join('')}</div>
    <p class="muted" style="font-size:13px">Ou me fala no chat o que mudar, do seu jeito: "troca o treino de perna pra quinta".</p>`, (el) => {
    el.querySelectorAll('[data-i]').forEach((b) => (b.onclick = () => editar(+b.dataset.i)));
  });
}
function newTaskSheet() {
  let cat = 'pessoal', catToque = false, off = 0, rep = 'nao', dias = [];
  const days = [0, 1, 2].map((o) => L.dayLabel(L.addDays(today(), o), today()));
  sheet(`<h3>Nova tarefa</h3>
    <label class="flabel" for="ntTitle">O que você precisa fazer?<input class="field" id="ntTitle" maxlength="80" placeholder="Ex.: Buscar exame no laboratório"></label>
    <div class="flabel">Categoria<div class="seg" id="ntCat"><button type="button" aria-pressed="true" data-v="pessoal">Pessoal</button><button type="button" aria-pressed="false" data-v="trabalho">Trabalho</button></div></div>
    <div class="flabel">Quando<div class="seg" id="ntDay">${days.map((d, i) => `<button type="button" aria-pressed="${i === 0}" data-v="${i}">${esc(d)}</button>`).join('')}</div></div>
    <label class="flabel" for="ntTime">Horário (opcional)<input class="field" id="ntTime" type="time"></label>
    <div class="flabel">Repetir<div class="seg" id="ntRep"><button type="button" aria-pressed="true" data-v="nao">Não</button><button type="button" aria-pressed="false" data-v="todo">Todo dia</button><button type="button" aria-pressed="false" data-v="dias">Alguns dias</button></div>
      <div class="wd7" id="ntDias" hidden>${['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map((l, i) => `<button type="button" aria-pressed="false" data-v="${i}" aria-label="${L.WEEKDAYS[i]}">${l}</button>`).join('')}</div></div>
    <p class="err" id="ntErr" hidden>Escreva o nome da tarefa.</p>
    <div class="row"><button class="btn light" type="button" id="ntCancel" style="flex:1">Cancelar</button><button class="btn" type="button" id="ntSave" style="flex:2">Criar tarefa</button></div>`, (el) => {
    const seg = (id, fn) => el.querySelector(id).addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; el.querySelectorAll(id + ' button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); fn(b.dataset.v); });
    seg('#ntCat', (v) => { cat = v; catToque = true; }); seg('#ntDay', (v) => (off = +v));
    // a aba se escolhe sozinha pelo nome enquanto a pessoa digita (até ela tocar numa)
    el.querySelector('#ntTitle').addEventListener('input', (e) => {
      if (catToque) return;
      cat = L.categoriaDe(e.target.value, S.catPrefs, 'pessoal');
      el.querySelectorAll('#ntCat button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.v === cat)));
    });
    seg('#ntRep', (v) => { rep = v; el.querySelector('#ntDias').hidden = v !== 'dias'; });
    el.querySelector('#ntDias').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; const d = +b.dataset.v; dias = dias.includes(d) ? dias.filter((x) => x !== d) : [...dias, d]; b.setAttribute('aria-pressed', String(dias.includes(d))); });
    el.querySelector('#ntCancel').onclick = closeSheet;
    el.querySelector('#ntSave').onclick = () => {
      const title = el.querySelector('#ntTitle').value.trim();
      if (!title) { const er = el.querySelector('#ntErr'); er.hidden = false; er.textContent = 'Escreva o nome da tarefa.'; return; }
      const tm = el.querySelector('#ntTime').value;
      const start = tm ? +tm.split(':')[0] * 60 + +tm.split(':')[1] : undefined;
      // escolheu outra aba do que o app escolheria: aprende para as próximas com esse nome
      if (catToque && L.categoriaDe(title, S.catPrefs, 'pessoal') !== cat) S.catPrefs = L.ensinarCategoria(S.catPrefs, [title], cat);
      if (rep !== 'nao') {
        const ds = rep === 'todo' ? [0, 1, 2, 3, 4, 5, 6] : dias.slice().sort();
        if (!ds.length) { const er = el.querySelector('#ntErr'); er.hidden = false; er.textContent = 'Escolha os dias da semana.'; return; }
        const r = addRoutine({ title: L.cap(title), dias: ds, start, end: start != null ? start + 30 : undefined, category: cat, color: cat === 'trabalho' ? 'blue' : 'green' }, L.addDays(today(), off));
        closeSheet(); render(true);
        toast(`Rotina criada: ${L.diasLabel(ds).toLowerCase()}`, { label: 'Desfazer', run: () => { deleteRoutine(r.id); render(true); } });
        return;
      }
      const undo = applyOps([{ type: 'add', task: { title: L.cap(title), date: L.addDays(today(), off), start, end: start != null ? start + 30 : undefined, category: cat, color: cat === 'trabalho' ? 'blue' : 'lilac' } }]);
      closeSheet(); render(true);
      toast('Tarefa criada', { label: 'Desfazer', run: () => { applyOps(undo); render(true); } });
    };
    setTimeout(() => el.querySelector('#ntTitle').focus(), 60);
  });
}

/** "Paguei": confirma o valor (a luz muda todo mês). */
function paySheet(id, m) {
  const fx = S.fin.fixas.find((x) => x.id === id); if (!fx) return;
  const renda = fx.tipo === 'renda', td = today();
  const pago = S.fin.pagas[`${id}:${m}`]; // já marcada: aqui corrige o valor ou a data
  sheet(`<div class="row" style="gap:10px">${irisImg(pago ? 'oculos' : 'comemorando', 44)}<div class="sub" style="flex:1">${pago ? 'Anotou algo errado? Corrige aqui:' : renda ? 'Dinheiro na conta! 💸' : 'Uma a menos! Confere o valor:'}</div></div>
    <h3>${esc(fx.nome)}</h3>
    <label class="flabel" for="pyVal">${renda ? 'Valor recebido' : 'Valor pago'}<input class="field valin" id="pyVal" inputmode="decimal" maxlength="14" value="${reais(pago ? pago.valor : fx.valor)}"></label>
    <label class="flabel" for="pyData">${renda ? 'Recebi em' : 'Paguei em'}<input class="field" id="pyData" type="date" max="${td}" value="${esc(pago?.data || td)}"></label>
    <p class="err" id="pyErr" hidden>Digite o valor.</p>
    <div class="row"><button class="btn light" type="button" id="pyNo" style="flex:1">Cancelar</button><button class="btn" type="button" id="pyYes" style="flex:2">${pago ? 'Salvar' : renda ? 'Recebi' : 'Paguei'}</button></div>
    ${pago ? `<button class="linkbtn" type="button" id="pyUn" style="color:var(--red-ink)">${renda ? 'Ainda não recebi' : 'Ainda não paguei'}</button>` : ''}`, (el) => {
    el.querySelector('#pyNo').onclick = closeSheet;
    el.querySelector('#pyUn')?.addEventListener('click', () => { const u = applyFin([{ type: 'despagar', id, mes: m }]); closeSheet(); render(true); toast(`${fx.nome} voltou para não ${renda ? 'recebido' : 'paga'}`, { label: 'Desfazer', run: () => undoFin(u) }); });
    el.querySelector('#pyYes').onclick = () => {
      const v = L.parseValor(el.querySelector('#pyVal').value), d = el.querySelector('#pyData').value || td;
      if (!v) { el.querySelector('#pyErr').hidden = false; return; }
      const undo = applyFin([{ type: 'pagar', id, mes: m, pago: { data: d > td ? td : d, valor: v, ...(pago?.em ? { em: pago.em } : {}) } }]);
      closeSheet(); render(true);
      if (pago) { toast('Corrigido ✅', { label: 'Desfazer', run: () => undoFin(undo) }); return; }
      const s2 = L.monthSummary(S.fin, m, today());
      toast(renda ? `${fx.nome} recebido` : s2.contas.abertas ? `${fx.nome} paga ✅ Faltam ${s2.contas.abertas}` : 'Todas as contas do mês pagas! 🎉', { label: 'Desfazer', run: () => undoFin(undo) });
    };
  });
}
/** Pagamento da fatura do cartão: corrigir o valor ou a data, ou desfazer. */
function faturaEditSheet(fid) {
  const fa = (S.fin.faturas || []).find((x) => x.id === fid); if (!fa) return;
  const td = today();
  sheet(`<h3>Fatura do cartão</h3><p class="muted" style="margin:0">Paga com ${plural(fa.movs.length, 'gasto', 'gastos')} no crédito.</p>
    <label class="flabel" for="feVal">Valor pago<input class="field valin" id="feVal" inputmode="decimal" maxlength="14" value="${reais(fa.valor)}"></label>
    <label class="flabel" for="feData">Paguei em<input class="field" id="feData" type="date" max="${td}" value="${esc(fa.data)}"></label>
    <p class="err" id="feErr" hidden>Digite o valor.</p>
    <div class="row"><button class="btn light" type="button" id="feNo" style="flex:1">Cancelar</button><button class="btn" type="button" id="feYes" style="flex:2">Salvar</button></div>
    <button class="linkbtn" type="button" id="feDel" style="color:var(--red-ink)">Ainda não paguei a fatura</button>`, (el) => {
    el.querySelector('#feNo').onclick = closeSheet;
    el.querySelector('#feDel').onclick = () => { const u = applyFin([{ type: 'delFatura', id: fid }]); closeSheet(); render(true); toast('Pagamento da fatura desfeito', { label: 'Desfazer', run: () => undoFin(u) }); };
    el.querySelector('#feYes').onclick = () => {
      const v = L.parseValor(el.querySelector('#feVal').value), d = el.querySelector('#feData').value || fa.data;
      if (!v) { el.querySelector('#feErr').hidden = false; return; }
      const u = applyFin([{ type: 'delFatura', id: fid }, { type: 'fatura', fatura: { id: fid, data: d > td ? td : d, valor: v, em: fa.em, movs: fa.movs } }]);
      closeSheet(); render(true); toast('Corrigido ✅', { label: 'Desfazer', run: () => undoFin(u) });
    };
  });
}
function limiteSheet() {
  sheet(`<h3>Limite do dia a dia</h3>
    <p class="muted" style="margin:0">Quanto você quer gastar no máximo por mês com mercado, comida, transporte, lazer... (sem contar as contas fixas). Eu te aviso quando estiver chegando perto.</p>
    <label class="flabel" for="lmVal">Por mês<input class="field valin" id="lmVal" inputmode="decimal" maxlength="14" placeholder="R$ 0,00" value="${S.fin.limite ? reais(S.fin.limite) : ''}"></label>
    <div class="row"><button class="btn light" type="button" id="lmNo" style="flex:1">${S.fin.limite ? 'Tirar limite' : 'Cancelar'}</button><button class="btn" type="button" id="lmYes" style="flex:2">Salvar</button></div>`, (el) => {
    el.querySelector('#lmNo').onclick = () => { if (S.fin.limite) { const u = applyFin([{ type: 'limite', valor: null }]); toast('Limite tirado', { label: 'Desfazer', run: () => undoFin(u) }); } closeSheet(); render(true); };
    el.querySelector('#lmYes').onclick = () => { const v = L.parseValor(el.querySelector('#lmVal').value); const u = applyFin([{ type: 'limite', valor: v }]); closeSheet(); render(true); toast(v ? `Limite de ${brl(v, true)} por mês` : 'Limite tirado', { label: 'Desfazer', run: () => undoFin(u) }); };
    setTimeout(() => el.querySelector('#lmVal').focus(), 60);
  });
}
function feedbackSheet() {
  let nota = 0;
  sheet(`<h3>O que você está achando do Faiz?</h3>
    <div class="flabel">De 1 a 5, quanto o Faiz te ajudou?<div class="stars" id="fbStars">${[1, 2, 3, 4, 5].map((n) => `<button type="button" aria-pressed="false" data-v="${n}">${n}</button>`).join('')}</div></div>
    <label class="flabel" for="fbText">Conte o que funcionou, o que faltou ou o que irritou<textarea class="field" id="fbText" maxlength="1500" placeholder="Ex.: gostei de montar a semana, mas queria que lembrasse de beber água"></textarea></label>
    <p class="err" id="fbErr" hidden>Escolha uma nota ou escreva um comentário.</p>
    <div id="fbSend"></div>
    <button class="btn light" type="button" data-close-sheet>Fechar</button>`, (el) => {
    el.querySelector('[data-close-sheet]').onclick = closeSheet;
    const out = el.querySelector('#fbSend');
    const msg = () => {
      const st = S.stats; const t = el.querySelector('#fbText').value.trim();
      return `Opinião sobre o Faiz${S.name ? ' — ' + S.name : ''}\nNota: ${nota || '-'} de 5\n${t ? 'Comentário: ' + t + '\n' : ''}\nUso: ${plural(st.days.length, 'dia', 'dias')}, ${plural(st.requests, 'pedido', 'pedidos')}, ${st.confirmed} confirmados, ${st.adjusted} ajustados, ${st.undone} desfeitos, ${st.tasksDone} tarefas concluídas, avisos ${U.pushState === 'on' ? 'ligados' : 'desligados'}, ${st.opened} avisos abertos, ${st.snoozed} adiados, IA ${st.ai} ok / ${st.aiFail} sem IA, voz ${st.voice || 0}, lugares ${st.nearby || 0}, rotinas ${S.routines.length}, anotações nas contas ${S.fin.mov.length + S.fin.fixas.length}. ${IS_IOS ? 'iPhone' : /Android/.test(UA) ? 'Android' : 'outro aparelho'}${STANDALONE ? ' (tela de início)' : ''}.`;
    };
    const draw = () => {
      const ready = nota || el.querySelector('#fbText').value.trim();
      const m = msg();
      out.innerHTML = waNumber
        ? `<a class="btn ${ready ? '' : 'light'}" href="${ready ? 'https://wa.me/' + esc(waNumber.replace(/\D/g, '')) + '?text=' + encodeURIComponent(m) : '#'}" target="_blank" rel="noopener" id="fbGo">Enviar pelo WhatsApp</a>`
        : `<div class="flabel">Copie e mande para quem te convidou<textarea class="field" readonly id="fbOut" style="height:130px">${esc(m)}</textarea></div><button class="btn" type="button" id="fbCopy">Copiar texto</button>`;
      const go = out.querySelector('#fbGo');
      if (go) go.addEventListener('click', (e) => { if (!ready) { e.preventDefault(); el.querySelector('#fbErr').hidden = false; } else toast('Abrindo o WhatsApp. Obrigado!'); });
      const cp = out.querySelector('#fbCopy');
      if (cp) cp.onclick = () => { const ta = out.querySelector('#fbOut'); navigator.clipboard?.writeText(ta.value).then(() => toast('Copiado'), () => { ta.select(); toast('Selecionei o texto: copie e cole no WhatsApp'); }); };
    };
    el.querySelector('#fbStars').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; nota = +b.dataset.v; el.querySelectorAll('#fbStars button').forEach((x) => x.setAttribute('aria-pressed', String(+x.dataset.v === nota))); el.querySelector('#fbErr').hidden = true; draw(); });
    el.querySelector('#fbText').addEventListener('input', () => { el.querySelector('#fbErr').hidden = true; draw(); });
    draw();
  });
}
function ownerSheet() {
  sheet(`<h3>Alertas do teste</h3>
    <p class="muted" style="margin:0">Para receber neste celular os alertas do teste (como o crédito da IA acabando), digite o seu WhatsApp, o mesmo que recebe as opiniões.</p>
    <label class="flabel" for="owWa">Seu WhatsApp com DDD<input class="field" id="owWa" inputmode="tel" maxlength="24" placeholder="(61) 99999-8888"></label>
    <p class="err" id="owErr" hidden></p>
    <div class="row"><button class="btn light" type="button" id="owNo" style="flex:1">Cancelar</button><button class="btn" type="button" id="owYes" style="flex:2">Ativar alertas</button></div>`, (el) => {
    el.querySelector('#owNo').onclick = closeSheet;
    el.querySelector('#owYes').onclick = async () => {
      const err = el.querySelector('#owErr');
      try {
        await Cloud.fn('owner', { whatsapp: el.querySelector('#owWa').value });
        U.owner = true; closeSheet(); render(true);
        toast(U.pushState === 'on' ? 'Pronto! Os alertas do teste vão chegar neste celular.' : 'Pronto! Ative os avisos em Mais para os alertas chegarem.');
      } catch (e) {
        err.hidden = false;
        err.textContent = e?.code === 'not_owner' ? 'Esse não é o número de quem organiza o teste.' : 'Não consegui agora. Confira a internet e tente de novo.';
      }
    };
    setTimeout(() => el.querySelector('#owWa').focus(), 60);
  });
}
function confirmSheet(title, body, okLabel, onOk) {
  sheet(`<h3>${esc(title)}</h3><p class="muted" style="margin:0">${esc(body)}</p><div class="row"><button class="btn light" type="button" id="cfNo" style="flex:1">Cancelar</button><button class="btn" type="button" id="cfYes" style="flex:1;background:var(--red-strong)">${esc(okLabel)}</button></div>`, (el) => {
    el.querySelector('#cfNo').onclick = closeSheet;
    el.querySelector('#cfYes').onclick = () => { closeSheet(); onOk(); };
  });
}

/* ---------- Ações ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || !$app.contains(el)) return;
  const a = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  switch (a) {
    case 'start': { const n = document.getElementById('nameInput').value.trim();
      if (!n) { toast('Me fala seu nome primeiro 😊'); document.getElementById('nameInput').focus(); break; }
      S.name = n; S.onboarded = true; S.startDate = today();
      // primeiro uso guiado (11/11, ideia do Tiago): nome → conta Google (obrigatória) → rotina com a Íris (sem pular) → avisos → tutorial
      S.onb = S.account?.google ? 'rotina' : 'conta'; S.stats.onb = { nome: new Date().toISOString() };
      if (S.onb === 'rotina') onbRotina();
      save(); U.tab = 'hoje'; render(); window.scrollTo(0, 0);
      // gente nova: grava a conta no servidor e já busca o plano (a tela de planos é a primeira coisa que aparece)
      clearTimeout(saveT); persistLocal(); Cloud.push().catch(() => {}).finally(() => planoAtualiza().finally(() => { U.meFeito = true; render(true); })); break; }
    case 'onb-fim': onbFim(); break;
    case 'skipinstall': S.skipInstall = true; U.showInstall = false; save(); render(); window.scrollTo(0, 0); break;
    case 'showinstall': U.showInstall = true; render(); window.scrollTo(0, 0); break;
    case 'permit': case 'notify': enableNotify(a === 'permit'); break;
    case 'later': S.permAsked = true; save(); render(); window.scrollTo(0, 0); toast('Tudo bem. Você pode ativar os avisos em Mais.'); break;
    case 'testpush': testPush(); break;
    case 'lead': S.settings.notify.lead = +v; save(); render(true); toast(`Vou te avisar ${v} minutos antes`); break;
    case 'morning': S.settings.notify.morning = S.settings.notify.morning ? null : '07:30'; save(); render(true); break;
    case 'night': S.settings.notify.night = S.settings.notify.night ? null : '21:00'; save(); render(true); break;
    case 'done': { const t = S.tasks.find((x) => x.id === id); closeSheet(); if (t && t.status !== 'feito') toggleTask(id); break; }
    case 'snooze': snooze(id, +v || 15); break;
    case 'resched': reschedule(id); break;
    case 'tab': if (v === 'mais' && U.tab !== 'mais') U.maisSec = null; if (v === 'contas' && U.tab !== 'contas') { U.finChatAt = null; U.finTab = 'geral'; } U.tab = v; if (v === 'faz') U.scrollChat = true; if (v === 'contas') gmailScan(); render(); if (v !== 'faz') window.scrollTo(0, 0); break;
    case 'filter': U.filter = v; render(true); break;
    case 'verAba': U.tab = 'hoje'; U.filter = v; render(); window.scrollTo(0, 0); break;
    case 'tfilter': U.tfilter = v; render(true); break;
    case 'toggle': toggleTask(id); break;
    case 'del': removeTask(id); break;
    case 'day': U.agenda = v; U.tab = 'agenda'; render(); window.scrollTo(0, 0); break;
    case 'week': U.agenda = L.addDays(U.agenda, +v); render(); break;
    case 'say': U.tab = 'faz'; render(); send(v); break;
    case 'confirm': confirmMsg(id); break;
    case 'adjust': adjustMsg(id); break;
    case 'undo': undoMsg(id); break;
    case 'newtask': newTaskSheet(); break;
    case 'tour': showTour(); break;
    case 'google-link': entrarGoogle('link'); break;
    case 'g-ligar': ligarGoogle(v); break;
    case 'cal-stop': calStop(); break;
    case 'g-desligar': desligarGoogle(); break;
    case 'g-scan': gmailScan(true); break;
    case 'g-anotar': gmailAnotar(id); break;
    case 'g-ignorar': gmailIgnorar(id); break;
    case 'google-login': entrarGoogle('login'); break;
    case 'gcals-nao': S.news = { ...(S.news || {}), gcals: true }; save(); render(true); break;
    case 'news-ok': S.news = { ...(S.news || {}), google: true }; save(); render(true); break;
    case 'novidade': novidadeSheet(); break;
    case 'entrevista': { if (S.entrevista?.on || S.entrevista?.pausa) { S.entrevista.on = true; S.entrevista.pausa = false; U.tab = 'faz'; entrevistaAsk(); } else entrevistaStart(); U.scrollChat = true; render(true); break; }
    case 'outra': { const inp = document.getElementById('chatInput'); if (inp) { inp.placeholder = v || 'Escreva do seu jeito'; inp.focus(); inp.scrollIntoView({ block: 'center', behavior: 'smooth' }); } break; }
    case 'entrevista-de-novo': entrevistaStart(); U.scrollChat = true; render(true); break;
    case 'entrevista-nao': S.entrevistaNao = true; save(); render(true); break;
    case 'google-depois': S.googleNudge = true; save(); render(true); break;
    case 'trialok': S.trialSeen = true; save(); render(true); break;
    case 'editroutine': editRoutineSheet(id); break;
    case 'edit': editSheet(id); break;
    case 'msgedit': msgEdit(id); break;
    case 'propedit': { const m = S.chat.find((x) => x.id === id); if (m?.proposal?.status === 'pending') propEditSheet(m); break; }
    case 'delroutine': { const r = S.routines.find((x) => x.id === id); if (r) confirmSheet(`Apagar a rotina "${r.title}"?`, 'As próximas vezes saem da agenda. O que você já fez continua no histórico.', 'Apagar', () => { deleteRoutine(id); render(true); toast('Rotina apagada'); }); break; }
    case 'mes': U.mes = +v === 0 ? null : L.addMonths(U.mes || L.monthOf(today()), +v); if (U.mes === L.monthOf(today())) U.mes = null; render(); break;
    case 'fin-gasto': movSheet('saida'); break;
    case 'fintab': U.finTab = v; render(); window.scrollTo(0, 0); break;
    case 'fin-saldo': saldoSheet(); break;
    case 'fin-saldo-skip': S.finSaldoSkip = true; save(); render(true); toast('Tudo bem! Se mudar de ideia, toque em Responder quando quiser ou me fale "tenho X na conta".'); break;
    case 'fin-fatura': faturaSheet(); break;
    case 'fin-editmov': movSheet(null, id); break;
    case 'fin-editfat': faturaEditSheet(id); break;
    case 'fin-delfat': { const u = applyFin([{ type: 'delFatura', id }]); render(true); toast('Pagamento da fatura desfeito', { label: 'Desfazer', run: () => undoFin(u) }); break; }
    case 'lper': U.lper = v; render(true); break;
    case 'ltipo': U.ltipo = v; render(true); break;
    case 'gper': U.gper = v; render(true); break;
    case 'gbar': U.gsel = +v; render(true); break;
    case 'fsay': send(v); break;
    case 'fin-entrada': movSheet('entrada'); break;
    case 'fin-fixa': fixaSheet(v); break;
    case 'fin-edit': fixaSheet(null, id); break;
    case 'fin-pay': paySheet(id, v); break;
    case 'fin-unpay': { const fx = S.fin.fixas.find((x) => x.id === id); const u = applyFin([{ type: 'despagar', id, mes: v }]); render(true); toast(`${fx?.nome || 'Conta'} voltou para não paga`, { label: 'Desfazer', run: () => undoFin(u) }); break; }
    case 'fin-delmov': { const x = S.fin.mov.find((y) => y.id === id); const u = applyFin([{ type: 'delMov', id }]); render(true); toast(`${x?.desc || 'Anotação'} apagada`, { label: 'Desfazer', run: () => undoFin(u) }); break; }
    case 'fin-limite': limiteSheet(); break;
    case 'feedback': feedbackSheet(); break;
    case 'avaliar': avaliarSheet(); break;
    case 'planos': planosScreen(false); break;
    case 'mais-sec': U.maisSec = v || null; S.stats.maisSec = { ...(S.stats.maisSec || {}), [v || 'inicio']: ((S.stats.maisSec || {})[v || 'inicio'] || 0) + 1 }; render(); window.scrollTo(0, 0); break;
    case 'cancelar-plus': cancelarPlus(); break;
    case 'owner': ownerSheet(); break;
    case 'problema': problemSheet(); break;
    case 'pesquisa': { const q = pesquisaDevida(); if (q) surveySheet(q); break; }
    case 'askbefore': S.settings.askBefore = !S.settings.askBefore; save(); render(true); break;
    case 'mic': Voice.start(); break;
    case 'speak': S.settings.speak = !S.settings.speak; save(); render(true); if (S.settings.speak) Voice.unlock(); if (S.settings.speak) Voice.speak('Pronto, vou ler as respostas em voz alta.'); break;
    case 'clearchat': confirmSheet('Apagar a conversa?', 'As mensagens com o Faiz somem deste celular. Suas tarefas continuam.', 'Apagar', () => { S.chat = []; save(); render(true); toast('Conversa apagada'); }); break;
    case 'reset': confirmSheet('Apagar todos os seus dados?', 'Tarefas, conversa e seu nome serão apagados deste celular. Não dá para desfazer.', 'Apagar tudo', () => { const st = S.stats; S = fresh(); S.stats = st; save(); U.tab = 'hoje'; render(); toast('Dados apagados'); }); break;
  }
});

/* Atividades tocáveis (role="button" em div): Enter e espaço também abrem */
document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('[role=button][data-act]')) { e.preventDefault(); e.target.click(); } });

/* Atualiza o "agora" e vira o dia sozinho */
setInterval(() => { markDay(); syncRoutines(); if (U.tab === 'agenda' || U.tab === 'hoje') render(true); }, 60000);
render();
openLink(location.href);
clearNotifications();
// o mini tutorial abre sozinho pelo render (coachWatch); quem já viu recebe o lembrete da pesquisa
if (S.tutorialSeen && !/[?&](t|v)=/.test(location.search)) setTimeout(surveyNudge, 800);
</script>
