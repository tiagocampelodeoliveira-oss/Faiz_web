name: Prévia da Íris

on:
  push:
    branches: [previa]
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: rrsonqbecicgfadqtjki

jobs:
  previa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes do servidor
        run: npx -y tsx --test tests/backend.test.ts tests/functions.test.ts
      - name: Íris completa x Íris rápida (não publica nada)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx -y tsx scripts/comparar.ts
