name: Prévia da Íris

on:
  push:
    branches: [previa]
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: rrsonqbecicgfadqtjki

jobs:
  previa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Como a ferramenta edge-tts conecta
        run: |
          pip install -q edge-tts
          python - <<'PY'
          import edge_tts, pathlib, re
          d = pathlib.Path(edge_tts.__file__).parent
          for f in ['constants.py', 'drm.py']:
              t = (d / f).read_text()
              print('::warning::FONTE ' + f + ': ' + t.replace('%', '%25').replace('\n', ' ⏎ ')[:20000])
          c = (d / 'communicate.py').read_text()
          i = c.find('websocket'); j = c.find('ws_connect')
          print('::warning::FONTE communicate.py: ' + c[max(0, j - 2500): j + 1500].replace('%', '%25').replace('\n', ' ⏎ '))
          PY
      - name: Voz da Íris (Node e Deno)
        run: |
          npx -y tsx scripts/tts-check.ts
          deno run -A scripts/tts-check.ts
      - name: Testes do servidor
        run: npx -y tsx --test tests/backend.test.ts tests/functions.test.ts
      - name: Frases reais com a Íris (não publica nada)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx -y tsx scripts/preview.ts
