name: Mandar aviso

on:
  workflow_dispatch:
    inputs:
      nome:
        description: 'Primeiro nome da pessoa (ou "-" para só ver os últimos avisos)'
        required: true
      titulo:
        description: 'Título do aviso'
        required: false
      texto:
        description: 'Texto do aviso'
        required: false
      quando:
        description: 'Data e hora de Brasília, ex.: 2026-11-09 12:00 (vazio = agora)'
        required: false

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: rrsonqbecicgfadqtjki

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Agendar o aviso
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NOME: ${{ inputs.nome }}
          TITULO: ${{ inputs.titulo }}
          TEXTO: ${{ inputs.texto }}
          QUANDO: ${{ inputs.quando }}
        run: npx -y tsx scripts/avisar.ts
