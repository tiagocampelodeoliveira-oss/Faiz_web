name: Liberar sem limite

on:
  workflow_dispatch:
    inputs:
      nomes:
        description: 'Primeiros nomes separados por vírgula (ex.: Amanda, Jhuliana)'
        required: true

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: rrsonqbecicgfadqtjki

jobs:
  liberar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Liberar (sem limite de 7 dias e de 40 pedidos por dia)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NOMES: ${{ inputs.nomes }}
        run: npx -y tsx scripts/liberar.ts
